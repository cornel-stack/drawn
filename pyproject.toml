# Root of the `drawn` uv workspace. This is a virtual project (not itself a
# package); the real code lives in packages/* which are workspace members.
[project]
name = "drawn"
version = "0.1.0"
description = "Hand-drawn-style educational YouTube videos from text lesson files."
requires-python = ">=3.12,<3.13"
dependencies = [
    "drawn-schema",
    "drawn-tts",
    "drawn-board",
    "drawn-cache",
    "drawn-finish",
]

[tool.uv]
package = false

[tool.uv.sources]
drawn-schema = { workspace = true }
drawn-tts = { workspace = true }
drawn-board = { workspace = true }
drawn-cache = { workspace = true }
drawn-finish = { workspace = true }
# This laptop/CI is CPU-only (Kokoro runs on CPU); force the CPU torch wheels
# instead of the default CUDA build, which drags in several GB of nvidia-*
# packages. torch arrives transitively via kokoro.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/assemble"]  # Remotion (Node) package, not a Python one

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Split so each CI job installs only what it needs (the tts job skips Manim/TeX;
# the render job skips Kokoro/whisper). `media` is everything, for local work.
tts = [
    "kokoro>=0.9",
    "torch>=2.2",       # CPU build via the pytorch-cpu index (see tool.uv.sources)
    "edge-tts>=6.1",
    "faster-whisper>=1.0",
    # faster-whisper 1.2.x calls av.open(metadata_errors=...), removed in PyAV 14.
    "av>=11,<14",
    "soundfile>=0.12",
]
render = [
    "manim>=0.18.1",
    "manim-voiceover>=0.3.7",
    # Manim 0.22's ImageMobject compositing passes a float64 array to
    # Image.fromarray(mode="RGBA"), which Pillow >=11 rejects. Pin below that.
    "pillow>=10,<11",
]
# Open-textbook download + per-section text extraction (`just sources`).
sources = [
    "pymupdf>=1.24",
]
# Background removal for the hand-photo pipeline (lazy-imported; `just hand`).
hand = [
    "rembg>=2.0",
    "pillow>=10,<11",
]
media = [
    {include-group = "tts"},
    {include-group = "render"},
    {include-group = "hand"},
    {include-group = "sources"},
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages"]
