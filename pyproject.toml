# Root of the `drawn` uv workspace. This is a virtual project (not itself a
# package); the real code lives in packages/* which are workspace members.
[project]
name = "drawn"
version = "0.1.0"
description = "Hand-drawn-style educational YouTube videos from text lesson files."
requires-python = ">=3.12,<3.13"
dependencies = [
    "drawn-schema",
    "drawn-tts",
    "drawn-board",
    "drawn-cache",
    "drawn-finish",
]

[tool.uv]
package = false

[tool.uv.sources]
drawn-schema = { workspace = true }
drawn-tts = { workspace = true }
drawn-board = { workspace = true }
drawn-cache = { workspace = true }
drawn-finish = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
# packages/assemble is a Remotion (Node) package; it has no pyproject so uv skips it.

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Heavy render/synthesis runtime, installed by `just setup` (and in CI).
# Kept out of the default sync so the schema/linter test loop stays fast.
media = [
    "manim>=0.18.1",
    "manim-voiceover>=0.3.7",
    "kokoro>=0.9",
    "edge-tts>=6.1",
    "faster-whisper>=1.0",
    "soundfile>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages"]
