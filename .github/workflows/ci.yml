name: ci

# Fast checks on every push/PR: unit tests, lint, and lesson validation.
# Full 1080p renders run via the manual `render` workflow.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: System deps (for Manim-backed tests)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev
      - run: uv sync --group render
      - name: Ruff
        run: uv run ruff check packages
      - name: Tests
        run: uv run pytest -q
      - name: Lint all lessons
        run: |
          shopt -s nullglob
          for f in channels/*/lessons/*.yaml; do
            uv run python -m drawn_schema lint "$f"
          done

  # Download + extract the open textbooks. PDFs are cached by the manifest's
  # sha256 pins, so a given hash is fetched at most once across all runs.
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Cache source PDFs
        uses: actions/cache@v4
        with:
          path: sources/*.pdf
          key: source-pdfs-${{ hashFiles('sources/manifest.yaml') }}
      - run: uv sync --group sources
      - name: Download + extract sources
        run: uv run python -m drawn_schema sources --repo-root "$PWD"
      - uses: actions/upload-artifact@v4
        with:
          name: sources-text
          path: sources/text
          retention-days: 7
