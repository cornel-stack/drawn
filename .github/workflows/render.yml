name: render

# Render a full lesson in CI and upload the finished folder as an artifact.
# Download it with:  gh run download <run-id> -n video-<channel>-<lesson>
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        required: true
        type: choice
        options: [chalk-and-vector, pen-and-pendulum, marginal-ink]
      lesson:
        description: Lesson code (e.g. ME-01)
        required: true
        type: string
      quality:
        description: Quality
        default: final
        type: choice
        options: [final, preview]

concurrency:
  group: render-${{ inputs.channel }}-${{ inputs.lesson }}
  cancel-in-progress: true

env:
  CH: ${{ inputs.channel }}
  CODE: ${{ inputs.lesson }}
  Q: ${{ inputs.quality }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scenes: ${{ steps.scenes.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: scenes
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, yaml, os
          d = yaml.safe_load(open(f"channels/{os.environ['CH']}/lessons/{os.environ['CODE']}.yaml"))
          print("list=" + json.dumps([s["id"] for s in d["scenes"]]))
          PY

  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: System deps (speech)
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg libsndfile1
      - name: Cache TTS models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v2
      - run: uv sync --group tts
      - name: Lint
        run: uv run python -m drawn_schema lint channels/$CH/lessons/$CODE.yaml
      - name: Fact-check gate
        run: uv run python -m drawn_schema factcheck-gate $CH $CODE --repo-root "$PWD"
      - name: Synthesise audio + alignment
        run: uv run python -m drawn_tts channels/$CH/lessons/$CODE.yaml --repo-root "$PWD"
      - name: Pacing check
        run: uv run python -m drawn_board.timeline channels/$CH/lessons/$CODE.yaml --repo-root "$PWD"
      - uses: actions/upload-artifact@v4
        with:
          name: tts
          path: |
            out/${{ env.CH }}/${{ env.CODE }}/audio
            out/${{ env.CH }}/${{ env.CODE }}/words

  render:
    needs: [plan, tts]
    runs-on: ubuntu-latest
    # Manim + a full TeX Live are baked into this pinned image, so each scene
    # job skips the ~8-minute TeX reinstall + Manim build that dominated the old
    # wall-clock. Digest below == manimcommunity/manim:v0.19.1, matching the
    # manim version pinned in uv.lock.
    container:
      image: manimcommunity/manim@sha256:95a2eb56e3e7519b310625a650c2ff20327b6437faced318c823a58401b70312
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJson(needs.plan.outputs.scenes) }}
    env:
      # import our src packages without an editable build (manim/numpy/pillow are
      # already in the image); only the two light pure-Python deps are installed.
      PYTHONPATH: ${{ github.workspace }}/packages/schema/src:${{ github.workspace }}/packages/board/src:${{ github.workspace }}/packages/cache/src
    steps:
      - uses: actions/checkout@v4
      - name: Python deps (manim + TeX already in the image)
        run: pip install --no-cache-dir pydantic pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: tts
          path: out/${{ env.CH }}/${{ env.CODE }}
      - name: Render scene ${{ matrix.scene }}
        run: |
          python -m drawn_board channels/$CH/lessons/$CODE.yaml \
            --repo-root "$GITHUB_WORKSPACE" --quality "$Q" --scene "${{ matrix.scene }}"
      - uses: actions/upload-artifact@v4
        with:
          name: clip-${{ matrix.scene }}
          path: out/${{ env.CH }}/${{ env.CODE }}/scenes/${{ matrix.scene }}.mp4

  assemble:
    needs: [render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: System deps (ffmpeg + headless chrome libs)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libgbm1 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 \
            libxkbcommon0 libpango-1.0-0 libcairo2
      - run: uv sync
      - name: Node deps
        working-directory: packages/assemble
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: tts
          path: out/${{ env.CH }}/${{ env.CODE }}
      - uses: actions/download-artifact@v4
        with:
          pattern: clip-*
          merge-multiple: true
          path: out/${{ env.CH }}/${{ env.CODE }}/scenes
      - name: Props
        run: uv run python -m drawn_finish props channels/$CH/lessons/$CODE.yaml --repo-root "$PWD" --quality "$Q"
      - name: Assemble (Remotion)
        working-directory: packages/assemble
        run: |
          O="$GITHUB_WORKSPACE/out/$CH/$CODE"
          pnpm exec remotion render src/index.ts Lesson "$O/assembly.mp4" \
            --props="$O/props.json" --public-dir="$GITHUB_WORKSPACE" --log=error
          pnpm exec remotion still src/index.ts Thumbnail "$O/thumbnail.png" \
            --props="$O/props.json" --public-dir="$GITHUB_WORKSPACE" --log=error
      - name: Finish + contact sheet
        run: |
          uv run python -m drawn_finish finish channels/$CH/lessons/$CODE.yaml --repo-root "$PWD"
          uv run python -m drawn_finish sheet channels/$CH/lessons/$CODE.yaml --repo-root "$PWD"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ env.CH }}-${{ env.CODE }}
          path: |
            out/${{ env.CH }}/${{ env.CODE }}/video.mp4
            out/${{ env.CH }}/${{ env.CODE }}/thumbnail.png
            out/${{ env.CH }}/${{ env.CODE }}/sheet.png
            out/${{ env.CH }}/${{ env.CODE }}/meta.md
            out/${{ env.CH }}/${{ env.CODE }}/captions.srt
