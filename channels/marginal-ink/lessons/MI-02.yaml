# Colour discipline: demand curve = orange, the two points / price change = yellow,
# elastic = green, inelastic = red, total revenue = purple.
schema_version: 1
id: MI-02
channel: marginal-ink
title: "How to solve elasticity problems (point, arc, revenue test)"
