# MI-04: Consumer and producer surplus — how to calculate them from a graph.
# OpenStax Principles of Economics 3e §3.5 (CC BY 4.0). ~7 minutes.
# Colour: demand = orange, supply = blue, equilibrium = green,
# consumer surplus = purple, producer surplus = yellow.
schema_version: 1
id: MI-04
channel: marginal-ink
title: "Consumer and producer surplus: how to calculate them from a graph"
target_minutes: 7
source:
  book: "OpenStax Principles of Economics 3e"
  section: "§3.5 Demand, Supply, and Efficiency"
  license: "CC BY 4.0"
  file: "principles-economics-3e/030-3-5-demand-supply-and-efficiency.md"
  pages: "74-77"
thumbnail:
  kicker: "Microeconomics"
  hook: "The triangle buyers never see"
  keyword: "triangle"
publish:
  title: "Consumer & Producer Surplus: How to Read Them Off a Graph"
  summary: >
    Consumer and producer surplus are just two triangles on the supply-and-demand
    diagram. This lesson shows exactly how to find the equilibrium, then measure
    each triangle with one half base times height — worked through on clean numbers.
  hashtags: ["#economics", "#microeconomics", "#supplyanddemand"]
  tags:
    - consumer surplus
    - producer surplus
    - total surplus
    - economic efficiency
