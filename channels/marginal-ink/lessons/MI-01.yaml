# MI-01: Supply and demand — what shifts a curve vs moves along it.
# OpenStax Principles of Microeconomics 2e Ch.3 (CC BY 4.0). ~9 minutes.
# Colour discipline: demand=orange, supply=blue, equilibrium=green, change=yellow.
schema_version: 1
id: MI-01
channel: marginal-ink
title: "Supply and demand: what shifts a curve, what moves along it"
target_minutes: 9
source:
  book: "OpenStax Principles of Microeconomics 2e"
  section: "Ch.3 Demand and Supply"
  license: "CC BY 4.0"

scenes:
  - id: s1
    kind: title
    narration: >
      Supply and demand is the first model every economist learns, {drawD1}, and
      also the one most often used sloppily. The whole payoff is a single
      distinction done cleanly: when does a curve simply move along itself, and
      when does the entire curve shift? Confuse the two and you will reach the
      wrong conclusion about prices, policies and firms; keep them apart and a
      surprising amount of economics falls into place. Get this right and
      markets start to make sense.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 0.8}
      steps:
        - {id: drawD1, action: draw_demand, params: {color: orange}}

  - id: s2
    kind: diagram
    narration: >
      Start with demand, {drawD}. The demand curve records, for each price, how
      much buyers want to purchase over some period. It slopes downward for two
      honest reasons: at a lower price each buyer tends to want more, and more
      people find the good worth buying at all. That downward slope is the law
      of demand, {lawD}, and it holds everything except the price itself fixed —
      incomes, tastes, the prices of other goods, all held still. Economists
      label that held-still clause with the Latin tag ceteris paribus, other
      things equal. It is the small print that makes the picture honest. Two
      quiet forces drive that slope: when a good gets cheaper it steals custom
      from its substitutes, the substitution effect; and a lower price frees up
      money to spend, the income effect. Picture petrol — let the pump price
      fall and the motorways slowly fill, no change in anyone's character
      required, only a change in price.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 0.8}
      steps:
        - {id: drawD, action: draw_demand, params: {color: orange}}
    board:
      - id: lawD
        text: "Law of demand: price up, quantity demanded down"
        color: orange

  - id: s3
    kind: diagram
    narration: >
      Now supply, {drawS}. The supply curve records, for each price, how much
      sellers are willing to offer. It slopes upward, {lawS}, because a higher
      price covers the rising cost of producing extra units and tempts more
      firms into the market. Again everything else is held equal: the prices of
      inputs, the technology, the number of sellers. Demand is about buyers and
      supply is about sellers, and the market is simply the place where their
      two intentions are forced to meet. The upward slope has its own quiet
      logic: producing each extra unit tends to cost a little more than the
      last, so sellers need a higher price to justify the effort, and a higher
      price also lures new firms through the door. Think of farmers planting
      more acres only when the crop price climbs enough to repay the extra land
      and labour.
    animation:
      primitive: supply_demand
      params:
        supply: {c: 1.0, d: 0.7}
      steps:
        - {id: drawS, action: draw_supply, params: {color: blue}}
    board:
      - id: lawS
        text: "Law of supply: price up, quantity supplied up"
        color: blue

  - id: s4
    kind: diagram
    narration: >
      Put both on the same axes, {drawS4} {drawD4}, and they cross at exactly one
      point, {eq4}. That crossing is the equilibrium: the one price at which the
      amount buyers want equals the amount sellers offer, with no shortage and no
      glut. Above it, sellers flood the market and the surplus pushes the price
      back down; below it, eager buyers compete and the shortage pushes the price
      back up. The market is self-correcting, forever nudged toward that single
      resting price and quantity. Suppose a shop prices its coffee too high:
      unsold cups pile up, a surplus, and the only cure is to mark the price
      down until the extra buyers appear. Price it too low and a queue forms out
      the door, a shortage, and the price is bid back up. No planner arranges
      this; the surplus or shortage is itself the signal, and the price does the
      steering.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 0.8}
        supply: {c: 1.0, d: 0.7}
      steps:
        - {id: drawS4, action: draw_supply, params: {color: blue}}
        - {id: drawD4, action: draw_demand, params: {color: orange}}
        - {id: eq4, action: equilibrium, params: {color: green}}

  - id: s5
    kind: diagram
    narration: >
      Here are the two curves once more, {drawS5} {drawD5}, and the distinction
      that trips everyone up. Suppose the price alone changes. Then nothing about
      buyers' underlying wants has altered; we simply slide to a new spot on the
      very same demand curve,
      {move5}. That is a change in the quantity demanded, a movement along the
      curve. The curve has not moved an inch. Price and quantity are partners on
      a fixed line, and travelling along that line is not the same as redrawing
      it.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 0.8}
        supply: {c: 1.0, d: 0.7}
      steps:
        - {id: drawS5, action: draw_supply, params: {color: blue}}
        - {id: drawD5, action: draw_demand, params: {color: orange}}
        - {id: move5, action: move_along, params: {curve: demand, to_q: 7.0, color: yellow}}

  - id: s6
    kind: diagram
    narration: >
      Now change something other than the price, {drawS6} {drawD6} {eq6}. Say
      incomes rise, so at every price buyers now want more. The entire demand
      curve shifts outward to the right, {shift6}, and the equilibrium slides up
      along the supply curve to a higher price and a larger quantity. This is a
      change in demand, a shift of the whole curve, and it is a completely
      different event from a slide along a fixed one. The rule is clean: a change
      in price moves you along; a change in anything else shifts the curve.
      Watch the language, because it carries the whole distinction. Economists
      reserve the phrase change in demand for a shift of the entire curve, and
      change in quantity demanded for a mere slide along it. They sound almost
      identical and mean completely different things, and marking that
      difference is half of a first exam in microeconomics.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 7.0, b: 0.8}
        supply: {c: 1.0, d: 0.7}
      steps:
        - {id: drawS6, action: draw_supply, params: {color: blue}}
        - {id: drawD6, action: draw_demand, params: {color: orange}}
        - {id: eq6, action: equilibrium, params: {color: green}}
        - {id: shift6, action: shift, params: {curve: demand, by: 2.0, color: orange}}

  - id: s7
    kind: diagram
    narration: >
      So what counts as something else, {drawS7} {drawD7}? For demand, five
      usual suspects, {shifters}: buyers' incomes, their tastes, the prices of
      related goods like substitutes and complements, their expectations about
      the future, and the sheer number of buyers in the market. Any one of them
      moving redraws the demand curve, {shift7}. For supply the list is its own:
      input prices, technology, taxes, and the number of sellers. Memorising the
      lists matters far less than the habit of asking, each time, has the price
      changed, or has something else? A couple make the point. If coffee grows
      fashionable, tastes shift demand right. If the price of tea, a substitute,
      jumps, buyers switch across and the demand for coffee rises too — a
      related price moving one market from inside another. Expectations count as
      well: if shoppers expect prices to climb next month, some buy now, pulling
      today's curve to the right.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 7.5, b: 0.8}
        supply: {c: 1.0, d: 0.7}
      steps:
        - {id: drawS7, action: draw_supply, params: {color: blue}}
        - {id: drawD7, action: draw_demand, params: {color: orange}}
        - {id: shift7, action: shift, params: {curve: demand, by: 1.5, color: orange}}
    board:
      - id: shifters
        text: "Demand shifters: income, tastes, related prices, expectations, buyers"
        color: yellow

  - id: s8
    kind: diagram
    narration: >
      On the supply side, {drawS8} {drawD8} {eq8}, the very same logic runs.
      Suppose a better technology lowers production costs. Sellers will now offer
      more at
      every price, so the supply curve shifts outward to the right, {shift8}, and
      the equilibrium slides down along the demand curve: the price falls and the
      quantity traded rises. Notice the discipline — we moved one curve, held the
      other still, and simply read off where the new crossing lands. That read-off
      is most of applied microeconomics. And both curves can move at once: a
      heatwave might lift the demand for ice cream while spoiling the cream that
      supplies it. When that happens, split the problem — shift one curve, read
      the result, then shift the other — rather than trying to picture both
      jumping together. Patience with one move at a time is what keeps the
      analysis honest.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 0.8}
        supply: {c: 1.5, d: 0.7}
      steps:
        - {id: drawS8, action: draw_supply, params: {color: blue}}
        - {id: drawD8, action: draw_demand, params: {color: orange}}
        - {id: eq8, action: equilibrium, params: {color: green}}
        - {id: shift8, action: shift, params: {curve: supply, by: -1.8, color: blue}}

  - id: s9
    kind: summary
    narration: >
      So: demand slopes down, {drawD9}, supply slopes up, {drawS9}, and they meet
      at an equilibrium that clears the market, {recap}. A change in the price is
      a movement along a curve; a change in anything else is a shift of the whole
      curve. Hold that one distinction firmly and you will never again confuse a
      change in quantity demanded with a change in demand. Next, in MA-01, we
      scale up from one market to the whole economy and measure its output.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 0.8}
        supply: {c: 1.0, d: 0.7}
      steps:
        - {id: drawD9, action: draw_demand, params: {color: orange}}
        - {id: drawS9, action: draw_supply, params: {color: blue}}
        - {id: recap, action: equilibrium, params: {color: green}}
    board: []

  - id: s10
    kind: end
    narration: ""
    board: []
