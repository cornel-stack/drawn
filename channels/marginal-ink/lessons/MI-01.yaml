# MI-01: Supply and demand — what shifts a curve and what moves along it.
# OpenStax Principles of Economics 3e §3.1-3.2 (CC BY 4.0). ~7 minutes.
# Colour discipline: demand = orange, supply = blue, equilibrium = green,
# a movement along a curve = yellow.
schema_version: 1
id: MI-01
channel: marginal-ink
title: "Supply and demand, properly: what shifts a curve and what moves along it"
target_minutes: 7
source:
  book: "OpenStax Principles of Economics 3e"
  section: "§3.1-3.2 Demand, Supply, Equilibrium, and Shifts"
  license: "CC BY 4.0"
  file: "principles-economics-3e/027-3-2-shifts-in-demand-and-supply-for-goods-and-services.md"
  pages: "64-79"

scenes:
  - id: s1
    kind: title
    narration: >
      Supply and demand is the first model every economist learns, and the one
      most often misused. The whole payoff is one clean distinction.

  - id: s2
    kind: diagram
    narration: >
      Start with demand, {drawD}. A demand curve records, for each price, the
      quantity that buyers are willing and able to purchase, with quantity on
      the horizontal axis and price on the vertical. It slopes downward because
      a higher price almost always reduces the quantity people buy, as they
      economise or switch to substitutes — this is the law of demand, {demandEq}.
      {pause:1.0} Now keep two words apart, because almost every mistake in this
      topic comes from blurring them. The whole curve, the entire schedule of
      price-and-quantity pairs, is called demand. A single point on it, the
      quantity bought at one particular price, is the quantity demanded. Demand
      is the curve; quantity demanded is a point on the curve. The curve itself
      is drawn holding fixed everything other than price — incomes, tastes, the
      prices of related goods. Hold that distinction firmly, because we are
      about to make both ideas move.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 1.0}
        supply: {c: 2.0, d: 1.0}
      steps:
        - {id: drawD, action: draw_demand, params: {color: orange}}
    board:
      - id: demandEq
        latex: "Q_d = a - b\\,P"
        say: "quantity demanded equals a minus b times price"
        color: orange
        legend:
          - {sym: "Q_d", name: "quantity demanded", unit: "units"}
          - {sym: "P", name: "price", unit: "currency"}
          - {sym: "b", name: "how strongly demand falls with price"}

  - id: s3
    kind: diagram
    narration: >
      Bring in the demand curve again, {drawD2}, and add the sellers, {drawS}. A
      supply curve records the quantity producers will offer at each price, and
      it slopes upward: a higher price makes selling more profitable, so firms
      produce and bring more to market, {supplyEq}. {pause:1.0} Placed on the
      same axes, the two curves cross exactly once, {eq}. At that crossing the
      quantity buyers want equals the quantity sellers offer, {eqCond}; the price
      there is the equilibrium price and the quantity is the equilibrium
      quantity. It is the one price where the plans of buyers and the plans of
      sellers agree. {pause:0.8} Away from it the market is restless. Set the
      price too high and sellers bring more than buyers will take — a surplus —
      and competing sellers cut the price until the extra goods clear. Set it too
      low and buyers want more than sellers supply — a shortage — and competing
      buyers bid the price up until the queue disappears. Notice that no planner
      arranges any of this: the surplus or the shortage is itself the signal, and
      the price is what moves in response. Only at the crossing do both pressures
      vanish, and the market comes to rest.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 1.0}
        supply: {c: 2.0, d: 1.0}
      steps:
        - {id: drawD2, action: draw_demand, params: {color: orange}}
        - {id: drawS, action: draw_supply, params: {color: blue}}
        - {id: eq, action: equilibrium, params: {color: green}}
    board:
      - id: supplyEq
        latex: "Q_s = c + d\\,P"
        say: "quantity supplied equals c plus d times price"
        color: blue
      - id: eqCond
        latex: "Q_d = Q_s"
        say: "quantity demanded equals quantity supplied"
        color: green

  - id: s4
    kind: diagram
    narration: >
      Here is the trap, {drawD3}. Suppose the price of the good itself changes,
      and nothing else — gasoline becomes dearer, say, because of a tax. Buyers
      respond by taking fewer trips, so we slide to a new point on the very same
      curve, {slide}. The curve has not moved an inch; only the quantity demanded
      has changed, from one point to another along it. Economists call this a
      change in quantity demanded — a movement along the curve. The logic is
      simple: price and quantity are the two things the curve relates, so
      changing the price just walks you up or down the line it already describes.
      Nothing about buyers' underlying willingness has changed.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 1.0}
        supply: {c: 2.0, d: 1.0}
      steps:
        - {id: drawD3, action: draw_demand, params: {color: orange}}
        - {id: slide, action: move_along, params: {curve: demand, to_q: 6.0, color: yellow}}

  - id: s5
    kind: diagram
    narration: >
      Now change something other than the price, {drawD4}. Put supply back,
      {drawS2}, and mark the equilibrium, {eq2}. Suppose buyers' incomes rise. At every single
      price they can now afford more, so the entire demand curve moves bodily to
      the right, {shiftD}. This is a change in demand — a shift of the whole
      curve — and it carries the market to a new equilibrium, at a higher price
      and a higher quantity. The same shift follows from a change in tastes, in
      the price of a substitute or complement, in expectations, or in the number
      of buyers. {pause:1.0} Supply behaves the same way, by its own symmetric
      list. A change in the good's own price moves you along the supply curve;
      but a change in input prices, in technology, in taxes, or in the number of
      sellers shifts the whole supply curve. A frost that kills half the orange
      crop shifts the supply of juice to the left, and the price climbs; a cheaper
      production method shifts it right, and the price falls. {pause:0.8} So the
      rule is exact, and it is the same for both curves. A change in the good's
      own price moves you along a fixed curve. A change in anything else shifts
      the whole curve to a new position. Confuse the two and you will predict the
      wrong direction for price; keep them apart and the model works every time.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 1.0}
        supply: {c: 2.0, d: 1.0}
      steps:
        - {id: drawD4, action: draw_demand, params: {color: orange}}
        - {id: drawS2, action: draw_supply, params: {color: blue}}
        - {id: eq2, action: equilibrium, params: {color: green}}
        - {id: shiftD, action: shift, params: {curve: demand, by: 2.0, color: orange}}

  - id: s6
    kind: problem
    narration: >
      Put numbers on it. {statement} We are given a demand equation and a supply
      equation, {given}, and we want the equilibrium. {find} Equilibrium is
      where the two quantities are equal, so set the right-hand sides equal to
      each other, {step1}. {pause:0.8} Gather the price terms on one side and the
      constants on the other: one thousand and fifty equals seven hundred and
      fifty times the price, {step2}. {pause:0.8} Divide through, and the
      equilibrium price is one dollar and forty cents, {step3}. {pause:0.8} Put
      that price back into either equation to get the quantity, six hundred
      million gallons, {answer}. That is exactly the crossing point we drew by
      hand — the algebra and the picture agree.
    board:
      - id: statement
        text: "A gasoline market, prices in dollars, quantities in millions of gallons."
      - id: given
        latex: "Q_d = 1300 - 500\\,P, \\qquad Q_s = 250 + 250\\,P"
        say: "quantity demanded equals thirteen hundred minus five hundred P; quantity supplied equals two hundred fifty plus two hundred fifty P"
        role: given
      - id: find
        text: "Find the equilibrium price and quantity."
        role: find
      - id: step1
        latex: "1300 - 500\\,P = 250 + 250\\,P"
        say: "thirteen hundred minus five hundred P equals two hundred fifty plus two hundred fifty P"
        role: step
        color: green
      - id: step2
        latex: "1050 = 750\\,P"
        say: "one thousand and fifty equals seven hundred and fifty P"
        role: step
      - id: step3
        latex: "P^{*} = \\dfrac{1050}{750} = 1.40"
        say: "P star equals ten fifty over seven fifty, equals one point four zero"
        role: step
        color: green
      - id: answer
        latex: "P^{*} = \\$1.40, \\quad Q^{*} = 600"
        say: "equilibrium price is one dollar forty, equilibrium quantity is six hundred million gallons"
        role: answer
        box: true
        color: green
    check:
      expr: "(1300 - 250) / (500 + 250)"
      value: 1.40
      unit: "dollars"
      tol: 0.01

  - id: s7
    kind: end
    narration: >
      In one line: the good's own price moves you along a curve; everything else
      shifts the whole curve. Next: elasticity — how sharply quantity responds
      when the price moves.
