# MI-01: Supply and demand — what shifts a curve and what moves along it.
# OpenStax Principles of Economics 3e §3.1-3.2 (CC BY 4.0). ~7 minutes.
# Colour discipline: demand = orange, supply = blue, equilibrium = green,
# a movement along a curve = yellow.
schema_version: 1
id: MI-01
channel: marginal-ink
title: "Supply and demand, properly: what shifts a curve and what moves along it"
target_minutes: 7
source:
  book: "OpenStax Principles of Economics 3e"
  section: "§3.1-3.2 Demand, Supply, Equilibrium, and Shifts"
  license: "CC BY 4.0"
  file: "principles-economics-3e/027-3-2-shifts-in-demand-and-supply-for-goods-and-services.md"
  pages: "64-79"

scenes:
  - id: s1
    kind: title
    narration: >
      Supply and demand is the foundational model of microeconomics. Its central
      lesson is a single distinction: what moves along a curve, and what shifts
      the curve itself.

  - id: s2
    kind: diagram
    narration: >
      Begin with demand, {drawD}. A demand curve shows, for each price, the
      quantity that buyers are willing and able to purchase. By convention,
      quantity is on the horizontal axis and price on the vertical. The curve
      slopes downward: as the price rises, the quantity demanded falls, because
      buyers economise or switch to substitutes. This is the law of demand,
      {demandEq}. {pause:0.4} Two terms must be distinguished carefully. Demand
      refers to the entire curve — the full schedule of price and quantity pairs.
      Quantity demanded refers to a single point on that curve: the amount bought
      at one specific price. The curve is drawn holding every other influence
      fixed. These other influences are called the determinants of demand:
      buyers' income, their tastes, the prices of related goods, their
      expectations, and the number of buyers. When the price changes, the point
      moves along the curve; when a determinant changes, the whole curve shifts.
      That difference is the core of this lesson.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 1.0}
        supply: {c: 2.0, d: 1.0}
      steps:
        - {id: drawD, action: draw_demand, params: {color: orange}}
    board:
      - id: demandEq
        latex: "Q_d = a - b\\,P"
        say: "quantity demanded equals a minus b times price"
        color: orange
        legend:
          - {sym: "Q_d", name: "quantity demanded", unit: "units"}
          - {sym: "P", name: "price", unit: "currency"}
          - {sym: "b", name: "how strongly demand falls with price"}

  - id: s3
    kind: diagram
    narration: >
      Redraw the demand curve, {drawD2}, and add supply, {drawS}. A supply curve
      shows the quantity producers will offer at each price. It slopes upward: a
      higher price raises the profit from selling, so firms supply more,
      {supplyEq}. {pause:0.4} On the same axes, the two curves cross once, {eq}.
      At that point, quantity demanded equals quantity supplied, {eqCond}. The
      corresponding price is the equilibrium price, and the quantity is the
      equilibrium quantity — the only price at which the amount buyers want and
      the amount sellers offer are equal. To read these values from the graph,
      locate the crossing point, then read across to the price axis for the
      equilibrium price and down to the quantity axis for the equilibrium
      quantity. {pause:0.4} At any other price, the market adjusts. Above the equilibrium, quantity supplied exceeds quantity
      demanded: a surplus, which drives the price down. Below the equilibrium,
      quantity demanded exceeds quantity supplied: a shortage, which drives the
      price up. The price stops changing only at the equilibrium.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 1.0}
        supply: {c: 2.0, d: 1.0}
      steps:
        - {id: drawD2, action: draw_demand, params: {color: orange}}
        - {id: drawS, action: draw_supply, params: {color: blue}}
        - {id: eq, action: equilibrium, params: {color: green}}
    board:
      - id: supplyEq
        latex: "Q_s = c + d\\,P"
        say: "quantity supplied equals c plus d times price"
        color: blue
      - id: eqCond
        latex: "Q_d = Q_s"
        say: "quantity demanded equals quantity supplied"
        color: green

  - id: s4
    kind: diagram
    narration: >
      Consider first a change in the price of the good itself, {drawD3}, with
      nothing else changing. Buyers adjust the quantity they purchase, moving to
      a different point on the same curve, {slide}. The curve does not move; only
      the quantity demanded changes. This is called a change in quantity
      demanded, or a movement along the curve. Price and quantity are the two
      variables the curve relates, so changing the price simply moves the point
      along the existing curve. Buyers' underlying willingness to pay is
      unchanged.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 1.0}
        supply: {c: 2.0, d: 1.0}
      steps:
        - {id: drawD3, action: draw_demand, params: {color: orange}}
        - {id: slide, action: move_along, params: {curve: demand, to_q: 6.0, color: yellow}}

  - id: s5
    kind: diagram
    narration: >
      Now consider a change in a factor other than the price, {drawD4} {drawS2}
      {eq2}. Suppose buyers' incomes rise. At every price, they now demand more,
      so the entire demand curve moves to the right, {shiftD}. This is a change
      in demand — a shift of the whole curve — and it produces a new equilibrium
      at a higher price and a higher quantity. A shift also results from a change
      in tastes, in the price of a substitute or complement, in expectations, or
      in the number of buyers. {pause:0.4} Supply follows the same rule. A change
      in the good's own price is a movement along the supply curve, while a
      change in input prices, technology, taxes, or the number of sellers shifts
      the whole supply curve. For example, a poor harvest shifts the supply of a
      crop to the left, raising its price. {pause:0.4} The distinction applies to
      both curves: a change in the good's own price is a movement along a fixed
      curve, and a change in any other factor is a shift of the whole curve.
    animation:
      primitive: supply_demand
      params:
        demand: {a: 8.0, b: 1.0}
        supply: {c: 2.0, d: 1.0}
      steps:
        - {id: drawD4, action: draw_demand, params: {color: orange}}
        - {id: drawS2, action: draw_supply, params: {color: blue}}
        - {id: eq2, action: equilibrium, params: {color: green}}
        - {id: shiftD, action: shift, params: {curve: demand, by: 2.0, color: orange}}

  - id: s6
    kind: problem
    narration: >
      Now a numerical example. {statement} A demand equation and a supply
      equation are given, {given}; find the equilibrium. {find} At equilibrium,
      the two quantities are equal, so set the right-hand sides equal, {step1}.
      {pause:0.4} Collect the price terms on one side: one thousand and fifty
      equals seven hundred and fifty times the price, {step2}. {pause:0.4} Divide
      to obtain the equilibrium price, one dollar and forty cents, {step3}.
      {pause:0.4} Substitute this price into either equation to obtain the
      quantity, six hundred million gallons, {answer}. To check, substitute one
      dollar forty into the demand equation: thirteen hundred minus five hundred
      times one point four is six hundred, which agrees with the supply equation
      and with the intersection drawn earlier.
    board:
      - id: statement
        text: "A gasoline market, prices in dollars, quantities in millions of gallons."
      - id: given
        latex: "Q_d = 1300 - 500\\,P, \\qquad Q_s = 250 + 250\\,P"
        say: "quantity demanded equals thirteen hundred minus five hundred P; quantity supplied equals two hundred fifty plus two hundred fifty P"
        role: given
      - id: find
        text: "Find the equilibrium price and quantity."
        role: find
      - id: step1
        latex: "1300 - 500\\,P = 250 + 250\\,P"
        say: "thirteen hundred minus five hundred P equals two hundred fifty plus two hundred fifty P"
        role: step
        color: green
      - id: step2
        latex: "1050 = 750\\,P"
        say: "one thousand and fifty equals seven hundred and fifty P"
        role: step
      - id: step3
        latex: "P^{*} = \\dfrac{1050}{750} = 1.40"
        say: "P star equals ten fifty over seven fifty, equals one point four zero"
        role: step
        color: green
      - id: answer
        latex: "P^{*} = \\$1.40, \\quad Q^{*} = 600"
        say: "equilibrium price is one dollar forty, equilibrium quantity is six hundred million gallons"
        role: answer
        box: true
        color: green
    check:
      expr: "(1300 - 250) / (500 + 250)"
      value: 1.40
      unit: "dollars"
      tol: 0.01

  - id: s7
    kind: end
    narration: >
      To summarise: a change in the good's own price is a movement along a curve;
      a change in any other factor shifts the whole curve. Next: elasticity — how
      strongly quantity responds to a change in price.
