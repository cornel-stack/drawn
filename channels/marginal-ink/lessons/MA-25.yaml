publish:
  title: "ALL of Intermediate Macroeconomics in 20 Minutes"
  summary: >
    A single fast tour of the whole of macroeconomics: GDP, growth, unemployment and
    inflation, the aggregate demand and supply model, the Keynesian multiplier, money
    and monetary policy, fiscal policy and debt, the Phillips curve, and the open
    economy — each idea, its key equation, and how they connect. Two worked examples.
  hashtags: ["#economics", "#macroeconomics", "#revision"]
