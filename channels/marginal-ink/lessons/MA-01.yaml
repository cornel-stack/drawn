publish:
  title: "GDP, Properly: The Three Ways to Measure One Number"
  summary: >
    GDP is the single number that sizes an entire economy — the market value of
    all final goods and services a country produces in a year. There are three
    independent routes to it: adding up spending, adding up production, and
    adding up income. They all land on the same total, and this explains why.
  hashtags: ["#economics", "#macroeconomics", "#GDP"]
  tags:
    - GDP
    - macroeconomics
