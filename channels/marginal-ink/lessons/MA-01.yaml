# MA-01: GDP — three ways to measure one number.
# OpenStax Principles of Economics 3e §19.1 (CC BY 4.0). ~9 minutes.
# Colour discipline: consumption C = orange, investment I = blue,
# government G = purple, net exports NX = red, GDP total = green.
# Figures are US 2020 (Table 19.1 / 19.2); the worked problem uses fresh numbers.
schema_version: 1
id: MA-01
channel: marginal-ink
title: "GDP, properly: three ways to measure one number"
target_minutes: 9
source:
  book: "OpenStax Principles of Economics 3e"
  section: "§19.1 Measuring the Size of the Economy — GDP"
  license: "CC BY 4.0"
