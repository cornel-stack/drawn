# MA-06: Growth accounting — how much of growth is capital, labour and ideas.
# OpenStax Principles of Economics 3e, Ch 20 (CC BY 4.0) for the components of
# growth; the growth-accounting equation and Solow residual are the standard
# intermediate-macro construction (flagged in the review). ~7 minutes.
# Colour: capital = blue, labour = orange, technology/residual = green, total = yellow.
schema_version: 1
id: MA-06
channel: marginal-ink
title: "Growth accounting: how much of growth is capital, labour and ideas?"
target_minutes: 7
source:
  book: "OpenStax Principles of Economics 3e"
  section: "§20.2-20.3 Labor Productivity and the Components of Economic Growth"
  license: "CC BY 4.0"
  file: "principles-economics-3e/228-20-3-components-of-economic-growth.md"
  pages: "487-498"
thumbnail:
  kicker: "Macroeconomics"
  hook: "The leftover that drives growth"
  keyword: "leftover"
publish:
  title: "Growth Accounting: Splitting Growth into Capital, Labour and Ideas"
  summary: >
    Growth accounting breaks an economy's output growth into the parts due to more
    capital, more labour, and better technology. We build the stacked bar, derive
    the Solow residual as what is left after capital and labour, and show why that
    leftover is our best measure of technological progress. Two worked examples.
  hashtags: ["#economics", "#macroeconomics", "#econ"]
  tags:
    - growth accounting
    - Solow residual
    - total factor productivity
    - economic growth
    - capital labour technology
    - macroeconomics
    - OpenStax

scenes:
  - id: s1
    kind: title
    narration: >
      When an economy grows, the growth comes from three sources: more machines, more
      workers, and better ideas. Growth accounting is the method that measures how much
      each one contributed.

  - id: s2
    kind: diagram
    narration: >
      Start at zero, {drawAxis}, and build up a year's output growth piece by piece.
      First the contribution of capital, {capBar}, in blue: the economy added machines
      and buildings, and that accounts for part of the growth. On top, the contribution
      of labour, {labBar}, in orange: more workers, or more hours, added another slice.
      Stack them and they do not reach the total, {techBar}, in green. The gap left over,
      once capital and labour are accounted for, is credited to technology — better ways
      of combining the same inputs. That green leftover is the famous Solow residual, and
      the whole bar, {totalLine}, is the measured growth of output — in symbols, {gaEq},
      output growth is this weighted sum of the three sources. The striking lesson
      from decades of this accounting is how tall the green piece usually is: for most
      rich economies, the single largest source of growth is not more capital or more
      labour, but the residual — the ideas. The thing we measure last, by subtraction,
      turns out to matter most.
    animation:
      primitive: bars
      params:
        value_max: 5.0
        bar_width: 1.3
      steps:
        - {id: drawAxis, action: axis, params: {label: "output growth (%)"}}
        - {id: capBar, action: segment, params: {stack: g, value: 1.8, color: blue, label: "capital", x: 0.0}}
        - {id: labBar, action: segment, params: {stack: g, value: 0.7, color: orange, label: "labour", x: 0.0}}
        - {id: techBar, action: segment, params: {stack: g, value: 1.5, color: green, label: "technology", x: 0.0}}
        - {id: totalLine, action: level, params: {value: 4.0, color: yellow, label: "total 4%"}}
    board:
      - id: gaEq
        latex: "\\tfrac{\\Delta Y}{Y} = \\alpha\\tfrac{\\Delta K}{K} + (1-\\alpha)\\tfrac{\\Delta L}{L} + \\tfrac{\\Delta A}{A}"
        say: "output growth equals alpha times capital growth, plus one minus alpha times labour growth, plus technology growth"
        color: yellow
        legend:
          - {sym: "\\alpha", name: "capital's share of income", unit: ""}
          - {sym: "\\tfrac{\\Delta A}{A}", name: "technology growth (residual)", unit: ""}

  - id: s3
    kind: derivation
    narration: >
      Here, {gaEq2}, is the equation behind the bar. Output growth is a weighted sum: the
      growth of capital, weighted by capital's share of income alpha, plus the growth of
      labour, weighted by labour's share, one minus alpha, plus the growth of technology.
      The weights are shares of national income, and they are not arbitrary — they come
      from how much each factor is actually paid. Capital and labour we can measure
      directly: we can count machines and workers and we know their income shares. But
      technology we cannot measure head-on. So we do the only thing we can, {residEq}:
      rearrange the equation and solve for the technology term as a residual — output
      growth minus the capital contribution minus the labour contribution. Whatever growth
      is not explained by more inputs gets attributed to better technology. This is why the
      residual is sometimes called total factor productivity, and, more wryly, a measure of
      our ignorance: it is everything we could not account for directly. If we have
      mismeasured capital or labour, the error lands in the residual too. Yet imperfect as
      it is, it remains the best single number we have for the progress of ideas, and it is
      the engine that part two of the Solow model showed is the only source of lasting
      growth in income per head. The method has a long reach beyond tidy textbook numbers.
      Run it across countries and the residual, not capital, explains most of why some are
      rich and some poor — the gap is less about how many machines a nation has than about
      how productively it uses them. Run it across time and you can date the great
      slowdowns and surges in a country's technological progress. And run it across
      industries and you can see which ones are genuinely innovating and which are merely
      adding inputs. One subtlety keeps it honest: because the weights are income shares,
      the method assumes factors are paid their true contribution, which holds only in
      reasonably competitive markets. Where that fails, the residual absorbs the
      distortion too. For all these caveats, growth accounting remains the first tool any
      economist reaches for when asking the oldest question in the field: where does growth
      actually come from.
    board:
      - id: gaEq2
        latex: "\\tfrac{\\Delta Y}{Y} = \\alpha\\tfrac{\\Delta K}{K} + (1-\\alpha)\\tfrac{\\Delta L}{L} + \\tfrac{\\Delta A}{A}"
        say: "output growth equals alpha capital growth, plus one minus alpha labour growth, plus technology growth"
        color: yellow
      - id: residEq
        latex: "\\tfrac{\\Delta A}{A} = \\tfrac{\\Delta Y}{Y} - \\alpha\\tfrac{\\Delta K}{K} - (1-\\alpha)\\tfrac{\\Delta L}{L}"
        say: "technology growth equals output growth, minus the capital contribution, minus the labour contribution"
        color: green
        box: true

  - id: s4
    kind: problem
    narration: >
      Finding the residual. {statement} An economy's output, capital and labour growth are
      measured, along with capital's income share, {given}; find the contribution of
      technology. {find} Use the residual formula, {step1}: output growth of four per cent,
      minus alpha of nought point three times capital growth of six per cent, minus nought
      point seven times labour growth of one per cent. Work the pieces, {step2}: capital
      contributes one point eight per cent, labour nought point seven. Subtract both from
      four, {answer}: the residual is one point five per cent. Technology, the part we never
      measured directly, accounts for well over a third of all the growth.
    board:
      - id: statement
        text: "Compute the Solow residual."
      - id: given
        latex: "\\tfrac{\\Delta Y}{Y}=4\\%,\\ \\tfrac{\\Delta K}{K}=6\\%,\\ \\tfrac{\\Delta L}{L}=1\\%,\\ \\alpha=0.3"
        say: "output growth four per cent, capital six, labour one, alpha nought point three"
        role: given
      - id: find
        text: "Find technology growth ΔA/A."
        role: find
      - id: step1
        latex: "\\tfrac{\\Delta A}{A} = 4 - 0.3(6) - 0.7(1)"
        say: "technology growth equals four, minus nought point three times six, minus nought point seven times one"
        role: step
        color: green
      - id: step2
        latex: "= 4 - 1.8 - 0.7"
        say: "equals four minus one point eight minus nought point seven"
        role: step
        color: blue
      - id: answer
        latex: "\\tfrac{\\Delta A}{A} = 1.5\\%"
        say: "technology growth equals one point five per cent"
        role: answer
        box: true
        color: green
    check:
      expr: "0.04 - 0.3*0.06 - 0.7*0.01"
      value: 0.015
      unit: ""
      tol: 0.01

  - id: s5
    kind: problem
    narration: >
      Capital's share of the growth. {statement2} Using the same figures, {given2}; find
      how much of the growth came from capital, and what fraction of the total that is.
      {find2} Capital's contribution is its weight times its growth, {step1b}: nought point
      three times six per cent, which is one point eight per cent. As a share of the four
      per cent total, {step2b}: one point eight over four. That is forty-five per cent,
      {answer2}. So adding machines drove almost half this economy's growth — substantial,
      but still less than capital and the residual together would suggest, and a reminder
      that no single factor explains it all.
    board:
      - id: statement2
        text: "Capital's contribution and its share."
      - id: given2
        latex: "\\alpha = 0.3, \\quad \\tfrac{\\Delta K}{K} = 6\\%, \\quad \\tfrac{\\Delta Y}{Y} = 4\\%"
        say: "alpha nought point three, capital growth six per cent, total growth four per cent"
        role: given
      - id: find2
        text: "Find capital's contribution and its share of growth."
        role: find
      - id: step1b
        latex: "\\alpha\\tfrac{\\Delta K}{K} = 0.3(6\\%) = 1.8\\%"
        say: "capital's contribution is nought point three times six per cent, one point eight per cent"
        role: step
        color: blue
      - id: step2b
        latex: "\\text{share} = \\dfrac{1.8}{4}"
        say: "its share is one point eight over four"
        role: step
        color: yellow
      - id: answer2
        latex: "\\text{share} = 45\\%"
        say: "forty-five per cent"
        role: answer
        box: true
        color: blue
    check:
      expr: "0.3 * 0.06"
      value: 0.018
      unit: ""
      tol: 0.01

  - id: s6
    kind: end
    narration: >
      To summarise: growth accounting splits output growth into contributions from capital
      and labour, weighted by their income shares, and assigns the remainder to technology;
      that Solow residual is measured by subtraction, yet is usually the largest single
      source of growth. Next: Consumption smoothing — the two-period model and permanent
      income.
