# Marginal Ink — how symbols and terms are spoken.
# Applied to `say` fields and narration before TTS. Longest match wins. Keep it
# complete as lessons add symbols (the linter warns about any speakable LaTeX
# symbol or proper noun with no entry). Hear it with `just pronounce-check`.
#
# Channel conventions: \pi is "profit" and \Delta is "change in" here, not the
# letter names — that is deliberate for economics notation.
map:
  # Greek letters (channel-specific readings first)
  "\\pi": "profit"
  "\\Delta": "change in"
  "\\delta": "delta"
  "\\epsilon": "epsilon"
  "\\varepsilon": "epsilon"
  "\\alpha": "alpha"
  "\\beta": "beta"
  "\\gamma": "gamma"
  "\\lambda": "lambda"
  "\\mu": "mu"
  "\\nu": "nu"
  "\\rho": "rho"
  "\\sigma": "sigma"
  "\\Sigma": "sigma"
  "\\theta": "theta"
  "\\phi": "phi"
  "\\omega": "omega"
  "\\Omega": "omega"
  "\\tau": "tau"
  "\\eta": "eta"
  # operators and relations
  "\\partial": "partial"
  "\\nabla": "del"
  "\\times": "times"
  "\\cdot": "times"
  "\\sum": "sum"
  "\\int": "integral"
  "\\infty": "infinity"
  "\\approx": "approximately"
  "\\leq": "less than or equal to"
  "\\geq": "greater than or equal to"
  "\\neq": "not equal to"
  "\\pm": "plus or minus"
  "\\propto": "proportional to"
  "\\to": "goes to"
  "\\rightarrow": "shifts to"
  "\\Rightarrow": "implies"
  "\\hat": "hat"
  "\\bar": "bar"
  # named people and terms
  "Cournot": "koor-noh"
  "Bertrand": "ber-trahn"
  "Stackelberg": "shtah-kel-berg"
  "Nash": "nash"
  "Pareto": "pa-ray-toh"
