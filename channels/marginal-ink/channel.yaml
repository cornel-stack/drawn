name: marginal-ink
display_name: "Marginal Ink"
board:
  style: board           # pure black board, white ink (Phase 1.5 legibility bar)
  background: "#000000"
  ink: "#ffffff"
  accent: "#5fd38a"       # default accent (green)
# Palette entries are ACCENTS ONLY (vectors, highlights, boxes) — never base ink.
palette:
  - "#5fd38a"            # green
  - "#5aa9ff"            # blue
  - "#ff9f43"            # orange
  - "#ff6b6b"            # red
accents:
  blue: "#5aa9ff"
  orange: "#ff9f43"
  green: "#5fd38a"
  red: "#ff6b6b"
  purple: "#c08cff"
  yellow: "#ffd24a"
font:
  handwriting: Kalam
  file: assets/fonts/Kalam-Regular.ttf
voice:
  service: kokoro
  kokoro_voice: bf_emma            # British female
  edge_voice: en-GB-SoniaNeural    # fallback
  speed: 0.85
intro_seconds: 2.0
outro_seconds: 3.0
