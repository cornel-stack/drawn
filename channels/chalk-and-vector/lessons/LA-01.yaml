# LA-01: What a system of linear equations really is — three pictures.
# Hefferon, Linear Algebra §1.I.1 Gauss's Method (CC BY-SA 3.0). ~7 minutes.
# Colour discipline: first equation / first column = blue; second = orange;
# solution / result = green; the target vector b = orange.
schema_version: 1
id: LA-01
channel: chalk-and-vector
title: "What a system of linear equations really is (and why 3 pictures beat 3 formulas)"
target_minutes: 7
source:
  book: "Linear Algebra (Jim Hefferon)"
  section: "§1.I.1 Gauss's Method"
  license: "CC BY-SA 3.0"
  file: "hefferon-linear-algebra/001-solving-linear-systems.md"
  pages: "11-44"
thumbnail:
  kicker: "Linear Algebra"
  hook: "3 pictures beat the formula"
  keyword: "3 pictures"
publish:
  title: "Linear Equations: 3 Pictures That Make It Finally Click"
  summary: >
    A system of linear equations can be read three ways — as intersecting lines,
    as a combination of vectors, and as an elimination procedure. Each reveals
    something the raw symbols hide, and together they make the whole subject
    click.
  hashtags: ["#linearalgebra", "#mathematics", "#math"]
  tags:
    - linear algebra
    - systems of equations
    - Gaussian elimination
    - row picture
    - column picture
    - vectors
    - mathematics
    - Hefferon

scenes:
  - id: s1
    kind: title
    narration: >
      A system of linear equations can be read in three ways: as intersecting
      lines, as a combination of vectors, and as an elimination procedure. This
      lesson covers all three.

  - id: s2
    kind: diagram
    narration: >
      The row picture, {eq1}. To draw this equation as a line, plot two
      points. Setting x to zero gives y equals minus three — the point {markP1}.
      Setting y to zero gives x equals one and a half — the point {markP2}. Join
      them to get the line, {lineA}. Every point on that line satisfies the
      equation, and because each unknown appears only to the first power — not
      squared, not multiplied by another, not inside a function — the graph is a
      straight line. Now the second equation, {eq2}, drawn as its own line,
      {lineB}. A solution must satisfy both equations at once, so it lies where
      the two lines cross, {cross}, here at x equals two and y equals one. The
      row picture also shows how many solutions a system has. If the two lines
      are parallel, they never meet: no solution. If they are the same line,
      every point satisfies both: infinitely many solutions. A system with at
      least one solution is called consistent; one with none, inconsistent. The
      same holds with more unknowns: with three unknowns each equation is a
      plane, and the solution is where the planes meet — at a point, along a
      line, or nowhere.
    animation:
      primitive: axes_plot
      params:
        x: [-2, 5, 1]
        y: [-3, 5, 1]
      steps:
        - {id: markP1, action: mark_point, params: {x: 0, y: -3, color: blue, label: "(0,-3)"}}
        - {id: markP2, action: mark_point, params: {x: 1.5, y: 0, color: blue, label: "(1.5,0)"}}
        - {id: lineA, action: plot_line, params: {name: LA, a: 2, b: -1, c: 3, color: blue}}
        - {id: lineB, action: plot_line, params: {name: LB, a: 1, b: 1, c: 3, color: orange}}
        - {id: cross, action: intersect, params: {line1: LA, line2: LB, color: green}}
    board:
      - id: eq1
        latex: "2x - y = 3"
        say: "two x minus y equals three"
        color: blue
      - id: eq2
        latex: "x + y = 3"
        say: "x plus y equals three"
        color: orange

  - id: s3
    kind: diagram
    narration: >
      Now the column picture, {cols}. Read the system down its columns instead
      of across its rows: the coefficients of x form one vector, and the
      coefficients of y form another. Written this way, the system is a single
      vector equation, {vecEq}: x times the first column plus y times the second
      column equals the right-hand side. Draw that right-hand side as a target
      vector, {bvec}. The question is now which multiples of the two column
      vectors add up to the target. Two of the first column plus one of the
      second reach it exactly, {comb}, which again gives x equals two and y
      equals one — the same solution, expressed as a combination of vectors. This
      view answers two further questions directly. Which targets can be reached?
      Exactly those that the columns can combine to produce, called their span.
      Because these two columns point in different directions, their combinations
      reach every point in the plane, {spanDots}, so every target has a solution.
      Were the two columns parallel, their combinations would only reach points
      along a single line, and most targets would have no solution at all. And
      when is the solution unique? Again, when the columns point in different
      directions, so that each target is built in exactly one way. The row
      picture and the column picture describe the same system from two sides.
    animation:
      primitive: linear_transform
      params:
        x_range: [-3, 5]
        y_range: [-2, 4]
        matrix: [[2, -1], [1, 1]]
      steps:
        - {id: cols, action: columns, params: {c1_color: blue, c2_color: orange, labels: ["c_1", "c_2"]}}
        - {id: bvec, action: vector, params: {x: 3, y: 3, color: green, label: "b"}}
        - {id: comb, action: combo, params: {x: 2, y: 1, c1_color: blue, c2_color: orange}}
        - {id: spanDots, action: span_demo, params: {color: green}}
    board:
      - id: vecEq
        latex: "x\\begin{pmatrix}2\\\\1\\end{pmatrix} + y\\begin{pmatrix}-1\\\\1\\end{pmatrix} = \\begin{pmatrix}3\\\\3\\end{pmatrix}"
        say: "x times the column two, one, plus y times the column minus one, one, equals the column three, three"
        color: green

  - id: s4
    kind: derivation
    narration: >
      Third, the algebra, {ops}. Gauss's method solves a system
      using three row operations, each of which leaves the solution set
      unchanged: swap two equations, multiply an equation by a non-zero number,
      or add a multiple of one equation to another. Each is safe for a clear
      reason. Swapping two equations only reorders the same system. Multiplying
      an equation by a non-zero number keeps the same solutions, because both
      sides scale together. And adding a multiple of one equation to another
      loses nothing, because any values satisfying both originals also satisfy
      their combination. The strategy is to eliminate
      one unknown at a time. To remove x, subtract: twice the second equation
      minus the first cancels the x terms and leaves {elim}. So y
      equals one. Substitute this into the first equation, {back}, which gives x
      equals two. The method generalises to any size. With more
      unknowns, eliminate the leading variable from each lower equation until the
      system is triangular, then substitute back upward. It always terminates and
      returns every solution, and it is exactly the procedure a computer uses to
      solve thousands of equations at once. All three pictures agree on the same
      result, {soln}: the lines cross there, the columns combine there, and the
      elimination lands there. You can confirm it by substitution — two times two
      minus one is three, and two plus one is three — so both equations hold.
    board:
      - id: ops
        text: "Row operations: swap; scale by a non-zero; add a multiple of another row."
        color: blue
      - id: elim
        latex: "2(x+y) - (2x - y) = 2(3) - 3 \\;\\Rightarrow\\; 3y = 3"
        say: "twice x plus y, minus two x minus y, equals twice three minus three, which gives three y equals three"
        color: orange
      - id: back
        latex: "x + y = 3 \\;\\Rightarrow\\; x = 2"
        say: "x plus y equals three, so x equals two"
        color: orange
      - id: soln
        latex: "(x, y) = (2, 1)"
        say: "x equals two, y equals one"
        color: green
        box: true

  - id: s5
    kind: problem
    narration: >
      Now a worked example. {statement} Two equations are given, {given}; find
      their solution. {find} Eliminate x by subtracting twice the first equation
      from the second, {step1}. The x terms cancel, leaving minus
      three y equals minus nine, so y equals three, {step2}.
      Substitute into the first equation: x plus three equals two, {step3}.
      The solution is x equals minus one, y equals three, {answer}.
      It is worth checking: minus one plus three is two, and twice minus one
      minus three is minus five. Both equations hold, so the solution is correct.
    board:
      - id: statement
        text: "Solve the system by Gauss's method."
      - id: given
        latex: "x + y = 2, \\qquad 2x - y = -5"
        say: "x plus y equals two; two x minus y equals minus five"
        role: given
      - id: find
        text: "Find the solution (x, y)."
        role: find
      - id: step1
        latex: "(2x - y) - 2(x + y) = -5 - 2(2)"
        say: "two x minus y, minus twice x plus y, equals minus five minus twice two"
        role: step
        color: blue
      - id: step2
        latex: "-3y = -9 \\;\\Rightarrow\\; y = 3"
        say: "minus three y equals minus nine, so y equals three"
        role: step
      - id: step3
        latex: "x + 3 = 2 \\;\\Rightarrow\\; x = -1"
        say: "x plus three equals two, so x equals minus one"
        role: step
        color: blue
      - id: answer
        latex: "(x, y) = (-1, 3)"
        say: "x equals minus one, y equals three"
        role: answer
        box: true
        color: green
    check:
      expr: "np.linalg.solve([[1, 1], [2, -1]], [2, -5])[0]"
      value: -1.0
      unit: ""
      tol: 0.01

  - id: s6
    kind: end
    narration: >
      To summarise: a linear system is three things at once — lines that
      intersect, vectors that combine, and an elimination that computes the
      result. Next: the geometry of n-dimensional space, where vectors gain a
      length and an angle.
