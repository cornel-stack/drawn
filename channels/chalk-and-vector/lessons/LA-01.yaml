# LA-01: What a system of linear equations really is — three pictures.
# Hefferon, Linear Algebra §1.I.1 Gauss's Method (CC BY-SA 3.0). ~7 minutes.
# Colour discipline: first equation / first column = blue; second = orange;
# solution / result = green; the target vector b = orange.
schema_version: 1
id: LA-01
channel: chalk-and-vector
title: "What a system of linear equations really is (and why 3 pictures beat 3 formulas)"
target_minutes: 7
source:
  book: "Linear Algebra (Jim Hefferon)"
  section: "§1.I.1 Gauss's Method"
  license: "CC BY-SA 3.0"
  file: "hefferon-linear-algebra/001-solving-linear-systems.md"
  pages: "11-44"

scenes:
  - id: s1
    kind: title
    narration: >
      A system of linear equations looks like a wall of symbols. But the same
      system can be seen in three different pictures, and the pictures explain
      far more than the formulas do.

  - id: s2
    kind: diagram
    narration: >
      Here is the row picture, {lineA}. That line is the first equation of a
      small system, {eq1}: every point on it satisfies that one equation. Linear
      means each unknown appears only on its own, to the first power — no
      squares, no products, no sines. Plot the second equation as a line too,
      {lineB}, {eq2}. A solution must satisfy both at once, so it has to lie on
      both lines — and two lines in a plane meet at a single point, {cross}.
      Reading off that crossing gives x equals two, y equals one.
      The first picture already tells us something the symbols hid: a solution
      exists, and because the lines are not parallel, it is the only one. Had the
      two lines come out parallel, they would never meet, and the system would
      have no solution at all. Had they come out as the very same line, every
      point on it would work, and there would be infinitely many. So the row
      picture does not just solve this system; it shows, at a glance, which of
      the three possibilities you are in. A system with at least one solution we
      call consistent, and one with none inconsistent — names for what the
      geometry makes obvious. And the same three fates survive into higher
      dimensions: with three unknowns each equation is a flat plane instead of a
      line, and the solution is where the planes meet — at a point, along a whole
      line, or nowhere at all.
    animation:
      primitive: axes_plot
      params:
        x: [-2, 5, 1]
        y: [-2, 5, 1]
      steps:
        - {id: lineA, action: plot_line, params: {name: LA, a: 2, b: -1, c: 3, color: blue}}
        - {id: lineB, action: plot_line, params: {name: LB, a: 1, b: 1, c: 3, color: orange}}
        - {id: cross, action: intersect, params: {line1: LA, line2: LB, color: green}}
    board:
      - id: eq1
        latex: "2x - y = 3"
        say: "two x minus y equals three"
        color: blue
      - id: eq2
        latex: "x + y = 3"
        say: "x plus y equals three"
        color: orange

  - id: s3
    kind: diagram
    narration: >
      Now the column picture, {cols}. Those two arrows are the coefficient
      columns, read straight off the system. Stacked this way, the very same
      system becomes a vector equation, {vecEq}: x times the first column plus y
      times the second column equals the right-hand side. Draw the target on the
      right as its own arrow, {bvec}. Now the question changes shape entirely.
      Instead of asking where two lines meet, we ask: how much of each column
      vector do we combine to reach the target? Take two of the first column and
      one of the second, laid tip to tail, {comb}, and they land exactly on the
      target. So x equals two, y equals one — the same answer, now read as a
      recipe for building one vector out of two others. This picture
      has its own test for solvability. If the target pointed somewhere the two
      columns could never reach between them, there would be no solution; but
      because these two columns point in genuinely different directions, their
      combinations sweep out the whole plane, so every target is reachable and
      the recipe for it is unique. Lines crossing and vectors combining are the
      same fact wearing two costumes.
    animation:
      primitive: linear_transform
      params:
        x_range: [-3, 5]
        y_range: [-2, 4]
        matrix: [[2, -1], [1, 1]]
      steps:
        - {id: cols, action: columns, params: {c1_color: blue, c2_color: orange, labels: ["c_1", "c_2"]}}
        - {id: bvec, action: vector, params: {x: 3, y: 3, color: green, label: "b"}}
        - {id: comb, action: combo, params: {x: 2, y: 1, c1_color: blue, c2_color: orange}}
    board:
      - id: vecEq
        latex: "x\\begin{pmatrix}2\\\\1\\end{pmatrix} + y\\begin{pmatrix}-1\\\\1\\end{pmatrix} = \\begin{pmatrix}3\\\\3\\end{pmatrix}"
        say: "x times the column two, one, plus y times the column minus one, one, equals the column three, three"
        color: green

  - id: s4
    kind: derivation
    narration: >
      The third picture is the algebra, {ops}. It is the one that actually
      computes. Gauss's method is built from three operations that never change a
      system's solutions: swap two rows, multiply a row by a non-zero number, or
      add a multiple of one row to another. Each of the three is
      reversible, so none can gain or lose a solution — it only rewrites the same
      system in a simpler form. We use them to remove unknowns one at a time,
      driving the system towards a triangular shape we can read from the bottom
      up. Take twice the second equation minus the first to eliminate x, and only
      y survives, {elim}. {pause:1.2} That gives y equals one at once. Substitute
      back into the second equation, {back}, and x equals two. {pause:1.0} What
      makes this a genuine algorithm, not a trick, is that it never stalls: with
      more unknowns you simply keep clearing the leading variable out of every
      lower equation until the system stands in a staircase, then climb back up
      substituting as you go. A thousand equations in a thousand unknowns fall to
      exactly this routine. The method never guesses and always terminates, and
      here all three pictures agree on the same solution, {soln} — the lines
      cross there, the columns combine there, and the elimination lands there.
    board:
      - id: ops
        text: "Row operations: swap; scale by a non-zero; add a multiple of another row."
        color: blue
      - id: elim
        latex: "2(x+y) - (2x - y) = 2(3) - 3 \\;\\Rightarrow\\; 3y = 3"
        say: "twice x plus y, minus two x minus y, equals twice three minus three, which gives three y equals three"
        color: orange
      - id: back
        latex: "x + y = 3 \\;\\Rightarrow\\; x = 2"
        say: "x plus y equals three, so x equals two"
        color: orange
      - id: soln
        latex: "(x, y) = (2, 1)"
        say: "x equals two, y equals one"
        color: green
        box: true

  - id: s5
    kind: problem
    narration: >
      Your turn, by elimination. {statement} We are given two equations, {given},
      and we want their unique solution. {find} Eliminate x by subtracting twice
      the first equation from the second, {step1}. {pause:0.8} The x terms cancel
      and we are left with minus three y equals minus nine, so y equals three,
      {step2}. {pause:0.8} Substitute back into the first equation, x plus three
      equals two, {step3}. {pause:1.0} So the solution is x equals minus one, y
      equals three, {answer} — the single point where these two lines cross.
    board:
      - id: statement
        text: "Solve the system by Gauss's method."
      - id: given
        latex: "x + y = 2, \\qquad 2x - y = -5"
        say: "x plus y equals two; two x minus y equals minus five"
        role: given
      - id: find
        text: "Find the solution (x, y)."
        role: find
      - id: step1
        latex: "(2x - y) - 2(x + y) = -5 - 2(2)"
        say: "two x minus y, minus twice x plus y, equals minus five minus twice two"
        role: step
        color: blue
      - id: step2
        latex: "-3y = -9 \\;\\Rightarrow\\; y = 3"
        say: "minus three y equals minus nine, so y equals three"
        role: step
      - id: step3
        latex: "x + 3 = 2 \\;\\Rightarrow\\; x = -1"
        say: "x plus three equals two, so x equals minus one"
        role: step
        color: blue
      - id: answer
        latex: "(x, y) = (-1, 3)"
        say: "x equals minus one, y equals three"
        role: answer
        box: true
        color: green
    check:
      expr: "np.linalg.solve([[1, 1], [2, -1]], [2, -5])[0]"
      value: -1.0
      unit: ""
      tol: 0.01

  - id: s6
    kind: end
    narration: >
      In one line: a linear system is lines meeting, columns combining, and
      elimination computing — one truth in three pictures. Next: the geometry of
      n-space, where these arrows gain a length and an angle.
