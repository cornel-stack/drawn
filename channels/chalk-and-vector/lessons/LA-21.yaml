# LA-21: How to actually find eigenvalues — the characteristic polynomial, visualised.
# Hefferon, Linear Algebra, Five.II.3 Eigenvalues and Eigenvectors (CC BY-SA 3.0).
# Follows LA-20 with the same matrix A=[[2,1],[1,2]]. ~7 minutes.
# Colour: polynomial = blue, eigenvalues/roots = red, trace = orange, determinant = green.
schema_version: 1
id: LA-21
channel: chalk-and-vector
title: "How to actually find eigenvalues: the characteristic polynomial, visualised"
target_minutes: 7
source:
  book: "Linear Algebra (Jim Hefferon)"
  section: "Five.II Similarity (Eigenvalues and Eigenvectors)"
  license: "CC BY-SA 3.0"
  file: "hefferon-linear-algebra/039-topic-stable-populations.md"
  pages: "399-404"
thumbnail:
  kicker: "Linear Algebra"
  hook: "Eigenvalues hide in a parabola"
  keyword: "a parabola"
publish:
  title: "Finding Eigenvalues: The Characteristic Polynomial Made Visual"
  summary: >
    Eigenvalues are the roots of a polynomial you build from the matrix itself.
    We show where that characteristic polynomial comes from, a two-by-two shortcut
    using the trace and determinant, and how the eigenvalues are simply where a
    parabola crosses zero. Then we find an eigenvector. Two worked examples.
  hashtags: ["#linearalgebra", "#mathematics", "#math"]
  tags:
    - eigenvalues
    - characteristic polynomial
    - trace and determinant
    - linear algebra
    - eigenvectors
    - characteristic equation
    - Hefferon

scenes:
  - id: s1
    kind: title
    narration: >
      Last time we met eigenvalues as the factors by which a matrix stretches its special directions. Now
      the practical question: given a matrix, how do you actually find them? The answer is the root of a
      single polynomial.

  - id: s2
    kind: diagram
    narration: >
      Here, {plotP}, is the key object, drawn in blue: the characteristic polynomial of a two-by-two matrix,
      plotted against lambda. It is a parabola, and the eigenvalues are nothing more than where it crosses
      zero, {markR1} {markR2} — the two red points on the axis. For this matrix they sit at lambda equals one
      and lambda equals three. That is the whole method in a picture: build this polynomial from the matrix,
      find where it hits the horizontal axis, and read off the eigenvalues. Where does the polynomial come
      from? From the condition we derived last time, {charEq}: the determinant of A minus lambda I must
      vanish. For a two-by-two matrix that determinant works out to a tidy quadratic, {polyEq}: lambda
      squared, minus the trace of the matrix times lambda, plus the determinant of the matrix. The trace is
      just the sum of the diagonal entries; the determinant you already know. So the parabola's shape is
      fixed entirely by two numbers you can read straight off the matrix, and its two crossings are the
      eigenvalues you are hunting.
    animation:
      primitive: axes_plot
      params:
        x: [-1, 5, 1]
        y: [-2, 4, 1]
        x_length: 7.6
        y_length: 3.8
        x_label: "\\lambda"
        y_label: "p(\\lambda)"
      steps:
        - {id: plotP, action: plot_function, params: {func: char_poly, color: blue, label: "p(\\lambda)"}}
        - {id: markR1, action: mark_point, params: {x: 1, y: 0, color: red, label: "\\lambda_1", dashed: false}}
        - {id: markR2, action: mark_point, params: {x: 3, y: 0, color: red, label: "\\lambda_2", dashed: false}}
    board:
      - id: charEq
        latex: "\\det(A - \\lambda I) = 0"
        say: "the determinant of A minus lambda I equals zero"
        color: red
      - id: polyEq
        latex: "\\lambda^2 - \\text{tr}(A)\\,\\lambda + \\det(A) = 0"
        say: "lambda squared, minus the trace times lambda, plus the determinant, equals zero"
        color: blue
        legend:
          - {sym: "\\text{tr}(A)", name: "trace: sum of the diagonal", unit: ""}
          - {sym: "\\det(A)", name: "the determinant", unit: ""}

  - id: s3
    kind: derivation
    narration: >
      Start here, {matEq}: a general two-by-two matrix with entries a, b, c, d. Subtract lambda down the
      diagonal, {subEq}. Its determinant is the product of the diagonal
      entries minus the product of the off-diagonal ones, {detEq}: a minus lambda, times d minus lambda,
      minus b c. Multiply out the first product and collect terms, {expandEq}: lambda squared, minus the
      quantity a plus d times lambda, plus a d minus b c. Look at what the two coefficients are. The number
      multiplying lambda is a plus d, the sum of the diagonal — that is the trace. The constant term, a d
      minus b c, is exactly the determinant of the original matrix. So the characteristic polynomial of any
      two-by-two matrix is lambda squared, minus the trace, times lambda, plus the determinant, {sumProdEq}.
      This gives a lovely shortcut, {hl:sumProdEq}: because a quadratic's roots sum to minus its middle
      coefficient and multiply to its constant term, the two eigenvalues must add up to the trace and
      multiply to the determinant. You can often guess them by inspection. Set the polynomial to zero and the
      quadratic formula finishes the job for any matrix, {quadEq}. Once you have an eigenvalue, the matching
      eigenvector costs one more step: substitute that lambda back and solve A minus lambda I, times the
      vector, equals zero, {evecEq}. That matrix is singular by construction, so the equation always has a
      non-zero solution — a whole line of them, in fact, since any scalar multiple of an eigenvector is
      itself an eigenvector. For a three-by-three matrix the same recipe gives a cubic, and in general an
      n-by-n matrix yields a polynomial of degree n, so an n-dimensional matrix has at most n eigenvalues.
      Finding eigenvalues, then, is nothing more exotic than finding the roots of a polynomial that the
      matrix hands you — and for the two-by-two case, that polynomial is a parabola whose crossings you can
      almost see.
    board:
      - id: matEq
        latex: "A = \\begin{pmatrix}a & b\\\\c & d\\end{pmatrix}"
        say: "a general two by two matrix a, b, c, d"
        color: blue
      - id: subEq
        latex: "A - \\lambda I = \\begin{pmatrix}a-\\lambda & b\\\\c & d-\\lambda\\end{pmatrix}"
        say: "subtract lambda down the diagonal"
        color: orange
      - id: detEq
        latex: "\\det(A-\\lambda I) = (a-\\lambda)(d-\\lambda) - bc"
        say: "the determinant is a minus lambda, times d minus lambda, minus b c"
        color: green
      - id: expandEq
        latex: "= \\lambda^2 - (a+d)\\lambda + (ad - bc)"
        say: "equals lambda squared, minus a plus d times lambda, plus a d minus b c"
        color: blue
      - id: sumProdEq
        latex: "\\lambda_1 + \\lambda_2 = \\text{tr}(A), \\quad \\lambda_1\\lambda_2 = \\det(A)"
        say: "the eigenvalues sum to the trace and multiply to the determinant"
        color: red
        box: true
      - id: quadEq
        latex: "\\lambda = \\dfrac{\\text{tr} \\pm \\sqrt{\\text{tr}^2 - 4\\det}}{2}"
        say: "lambda is the trace, plus or minus the root of trace squared minus four det, over two"
        color: orange
      - id: evecEq
        latex: "(A - \\lambda I)\\,\\mathbf{v} = \\mathbf{0}"
        say: "solve A minus lambda I times v equals zero for the eigenvector"
        color: green

  - id: s4
    kind: problem
    narration: >
      Finding the eigenvalues. {statement} A two-by-two matrix is given, {given}; find its eigenvalues using
      the trace and determinant. {find} The trace is the sum of the diagonal, two plus two, which is four;
      the determinant is two times two minus one times one, which is three, {step1}. The characteristic
      equation is therefore lambda squared minus four lambda plus three equals zero, {step2}, which factors
      as lambda minus one, times lambda minus three. The eigenvalues are the roots, {answer}: lambda equals
      one and lambda equals three — exactly the two points where our parabola crossed the axis.
    board:
      - id: statement
        text: "Find the eigenvalues."
      - id: given
        latex: "A = \\begin{pmatrix}2 & 1\\\\1 & 2\\end{pmatrix}"
        say: "the matrix two, one, one, two"
        role: given
      - id: find
        text: "Find λ via trace and determinant."
        role: find
      - id: step1
        latex: "\\text{tr} = 4,\\quad \\det = 2(2)-1(1) = 3"
        say: "the trace is four, the determinant is three"
        role: step
        color: orange
      - id: step2
        latex: "\\lambda^2 - 4\\lambda + 3 = (\\lambda-1)(\\lambda-3) = 0"
        say: "lambda squared minus four lambda plus three, factors as lambda minus one times lambda minus three"
        role: step
        color: blue
      - id: answer
        latex: "\\lambda = 1,\\ 3"
        say: "the eigenvalues are one and three"
        role: answer
        box: true
        color: red
    check:
      expr: "(4 - np.sqrt(4**2 - 4*3)) / 2"
      value: 1
      unit: ""
      tol: 0.01

  - id: s5
    kind: problem
    narration: >
      {statement2} Now take the larger eigenvalue, lambda equals three, and find a matching eigenvector,
      {given2}. {find2} Form A minus three times the identity, {step1b}: subtract three from each diagonal
      entry to get minus one, one, one, minus one. Set this times the vector equal to zero, {step2b}: the top
      row says minus v-one plus v-two equals zero, so v-two equals v-one. Any vector with equal components
      works, so take the simplest, {answer2}: the vector one, one. Check it if you like — the matrix sends
      one, one to three, three, which is three times itself, exactly as an eigenvalue of three demands. The
      eigenvalue told us how much; the eigenvector tells us which direction.
    board:
      - id: statement2
        text: "Find an eigenvector for λ = 3."
      - id: given2
        latex: "\\lambda = 3"
        say: "the eigenvalue three"
        role: given
      - id: find2
        text: "Solve (A − 3I)v = 0."
        role: find
      - id: step1b
        latex: "A - 3I = \\begin{pmatrix}-1 & 1\\\\1 & -1\\end{pmatrix}"
        say: "A minus three I is minus one, one, one, minus one"
        role: step
        color: orange
      - id: step2b
        latex: "-v_1 + v_2 = 0 \\ \\Rightarrow\\ v_2 = v_1"
        say: "minus v one plus v two is zero, so v two equals v one"
        role: step
        color: blue
      - id: answer2
        latex: "\\mathbf{v} = \\begin{pmatrix}1\\\\1\\end{pmatrix}"
        say: "the eigenvector is one, one"
        role: answer
        box: true
        color: red
    check:
      expr: "(-1)*1 + 1*1"
      value: 0
      unit: ""
      tol: 0.01

  - id: s6
    kind: end
    narration: >
      To summarise: the eigenvalues of a matrix are the roots of its characteristic polynomial, the
      determinant of A minus lambda I; for a two-by-two matrix that is lambda squared minus the trace times
      lambda plus the determinant, so the eigenvalues sum to the trace and multiply to the determinant. Solve
      for each lambda, then solve A minus lambda I times v equals zero for its eigenvector. Next:
      Diagonalisation — why A equals P D P inverse makes everything easy.
