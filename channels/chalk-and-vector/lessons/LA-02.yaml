# LA-02: Gaussian elimination, visualised row by row.
# Hefferon, Linear Algebra §1.I Gauss's Method (CC BY-SA 3.0). ~9 minutes.
# Colour discipline: pivot = blue, row being eliminated = orange,
# the new zero = green, solution = green.
schema_version: 1
id: LA-02
channel: chalk-and-vector
title: "Gaussian elimination: the algorithm, visualised row by row"
target_minutes: 9
source:
  book: "Linear Algebra (Jim Hefferon)"
  section: "§1.I Gauss's Method"
  license: "CC BY-SA 3.0"
  file: "hefferon-linear-algebra/001-solving-linear-systems.md"
  pages: "11-44"
thumbnail:
  kicker: "Linear Algebra"
  hook: "One algorithm solves them all"
  keyword: "One algorithm"
publish:
  title: "Gaussian Elimination: Solve Any Linear System, Row by Row"
  summary: >
    Gauss's method turns any system of linear equations into a triangular
    staircase using three row operations, then reads off the answer by
    back-substitution. We run the full algorithm on a 3x3 system, one row
    operation at a time, and show exactly what each step does to the matrix.
  hashtags: ["#linearalgebra", "#mathematics", "#math"]
  tags:
    - linear algebra
    - Gaussian elimination
    - Gauss's method
    - row operations
    - echelon form
    - back substitution
    - augmented matrix
    - systems of equations

scenes:
  - id: s1
    kind: title
    narration: >
      Gauss's method solves any system of linear equations by the same
      mechanical routine: tidy the equations into a staircase, then read the
      answer off from the bottom up.

  - id: s2
    kind: diagram
    narration: >
      Start with an augmented matrix, {drawA}. This builds on the previous
      lesson, where one system was read three ways; here we concentrate on the
      mechanical algorithm itself — the one a computer runs. Each row of the grid
      is a single equation, stripped down to just its coefficients, with the
      constants written after the vertical bar, {augNote}. Working on the grid is
      only a lighter, quicker way of working on the equations; nothing is lost in
      the shorthand. The whole method is built from three elementary row
      operations, {ops}, and the crucial fact is that each of them leaves the
      solution set completely unchanged. First, you may swap two rows, {sw}. A
      system is just a list of requirements joined by the word and, and reordering
      that list changes nothing — the same values still satisfy it. Second, you
      may multiply a row by a non-zero number, {sc}. Both sides scale together, so
      any solution of the old equation solves the new one, and dividing back
      recovers it; the number must be non-zero, since multiplying by zero would
      simply throw the equation away. Third, and most powerful, you may add a
      multiple of one row to another, {cmb}. Here twice the top row is subtracted
      from the bottom, and watch the leading entry collapse to a zero. Any values
      satisfying both original rows satisfy their combination, and the step undoes
      itself by subtracting the multiple back — so once again, no solution is
      gained or lost. That third move is the engine of the whole method.
    animation:
      primitive: matrix
      params:
        rows: [[2, 4, 6], [1, 3, 5]]
      steps:
        - {id: drawA, action: draw, params: {rows: [[2, 4, 6], [1, 3, 5]]}}
        - {id: sw, action: swap, params: {i: 0, j: 1}}
        - {id: sc, action: scale, params: {i: 1, k: 0.5}}
        - {id: cmb, action: combine, params: {target: 1, src: 0, k: -1}}
    board:
      - id: augNote
        text: "Augmented matrix: coefficients, a bar, then the constants."
        color: blue
      - id: ops
        text: "Row operations: swap; scale by a non-zero; add a multiple of another."
        color: blue

  - id: s3
    kind: diagram
    narration: >
      Now a three-by-three system, {drawM}. The strategy is simple to state: clear
      out one column at a time, working down the diagonal, until only a staircase
      of entries is left. Begin with the first pivot, the leading one in the top
      row, {hp0}. The plan is to use it to remove the leading x term from every
      row beneath. Row two becomes row two minus twice row one, {elim1}; the two
      in its first slot cancels against twice the one above, and the leading entry
      drops to zero. Do the same below: row three becomes row three minus three
      times row one, {elim2}, and its leading entry is zero as well. Notice we only
      ever add multiples of the pivot row to the rows below it, never to the rows
      above, so once a column is cleared it stays cleared as we work downwards. The
      whole first column below the pivot is now clear. Move down to the second pivot, now
      sitting in the middle row, {hp1}, and repeat the idea on the one row beneath
      it: row three becomes row three plus twice row two, {elim3}. The second
      column is cleared too. What is left is echelon form, {echLabel}: a clean
      staircase, each leading entry strictly to the right of the one above, with
      nothing but zeros below. The third pivot now sits alone at the bottom, {hp2},
      an equation in a single unknown, ready to solve.
    animation:
      primitive: matrix
      params:
        rows: [[1, 1, 1, 6], [2, 3, 1, 11], [3, 1, 4, 17]]
      steps:
        - {id: drawM, action: draw, params: {rows: [[1, 1, 1, 6], [2, 3, 1, 11], [3, 1, 4, 17]]}}
        - {id: hp0, action: highlight, params: {i: 0, col: 0}}
        - {id: elim1, action: combine, params: {target: 1, src: 0, k: -2}}
        - {id: elim2, action: combine, params: {target: 2, src: 0, k: -3}}
        - {id: hp1, action: highlight, params: {i: 1, col: 1}}
        - {id: elim3, action: combine, params: {target: 2, src: 1, k: 2}}
        - {id: hp2, action: highlight, params: {i: 2, col: 2}}
    board:
      - id: echLabel
        text: "Echelon form: leading entries step to the right; zeros below."
        color: blue

  - id: s4
    kind: derivation
    narration: >
      As equations, {ech}. The staircase is deliberately easy to unwind, and we do
      it from the bottom upwards — this is back-substitution. The last row involves
      only one unknown: it says minus z equals minus three, so z must be three,
      {bs1}. Now carry that value up one row. The middle row, y minus z equals
      minus one, becomes y minus three equals minus one, which gives y equals two,
      {bs2}. Carry both known values up to the top row: x plus y plus z equals six
      becomes x plus two plus three equals six, so x equals one, {bs3}. All three
      unknowns are now pinned down, {soln}. Because every operation we performed
      was reversible, and none of them changed the solution set, these three
      numbers satisfy the original, untouched equations exactly — put them back in
      and the equations hold. That is the sense in which the method is safe: it
      never loses a genuine solution, and never manufactures a false one. And this
      is why triangular, echelon form is the goal of the forward pass: once the
      equations form a staircase, each one introduces exactly one new unknown, so
      solving turns into a simple march upward with no guessing at all.
    board:
      - id: ech
        latex: "x + y + z = 6, \\quad y - z = -1, \\quad -z = -3"
        say: "x plus y plus z equals six; y minus z equals minus one; minus z equals minus three"
        color: blue
      - id: bs1
        latex: "-z = -3 \\;\\Rightarrow\\; z = 3"
        say: "minus z equals minus three, so z equals three"
        color: orange
      - id: bs2
        latex: "y - z = -1 \\;\\Rightarrow\\; y = 2"
        say: "y minus z equals minus one, so y equals two"
        color: orange
      - id: bs3
        latex: "x + y + z = 6 \\;\\Rightarrow\\; x = 1"
        say: "x plus y plus z equals six, so x equals one"
        color: orange
      - id: soln
        latex: "(x, y, z) = (1, 2, 3)"
        say: "x equals one, y equals two, z equals three"
        color: green
        box: true

  - id: s5
    kind: problem
    narration: >
      Try one more. {statement} Here is a second system, {given}, solved in exactly
      the same shorthand. {find} Clear the first
      column using the top pivot: row two becomes row two minus twice row one,
      {step1}, and row three becomes row three minus row one, {step2}. Both leading
      entries below the pivot fall to zero. Now clear the second column with the
      middle pivot: row three becomes row three minus twice row two, {step3},
      leaving echelon form. Back-substitute from the bottom: the last row gives z
      equals minus one; the middle row then gives y equals one; and the top row
      gives x equals two. The solution is two, one, minus one, {answer}.
    board:
      - id: statement
        text: "Solve the system by Gauss's method."
      - id: given
        latex: "x + y + z = 2, \\quad 2x + y + 3z = 2, \\quad x - y + 2z = -1"
        say: "x plus y plus z equals two; two x plus y plus three z equals two; x minus y plus two z equals minus one"
        role: given
      - id: find
        text: "Find (x, y, z)."
        role: find
      - id: step1
        latex: "\\rho_2 \\to \\rho_2 - 2\\rho_1"
        say: "row two becomes row two minus twice row one"
        role: step
        color: orange
      - id: step2
        latex: "\\rho_3 \\to \\rho_3 - \\rho_1"
        say: "row three becomes row three minus row one"
        role: step
        color: orange
      - id: step3
        latex: "\\rho_3 \\to \\rho_3 - 2\\rho_2"
        say: "row three becomes row three minus twice row two"
        role: step
        color: orange
      - id: answer
        latex: "(x, y, z) = (2, 1, -1)"
        say: "x equals two, y equals one, z equals minus one"
        role: answer
        box: true
        color: green
    check:
      expr: "np.linalg.solve([[1,1,1],[2,1,3],[1,-1,2]], [2,2,-1])[0]"
      value: 2.0
      unit: ""
      tol: 0.01

  - id: s6
    kind: diagram
    narration: >
      Two cases look like trouble, {drawC}. The first: suppose clearing a column
      leaves a row of the form zero equals one, {bad}. The left side is zero but
      the right side is not, and no choice of the unknowns can ever make that true.
      The system is contradictory — it has no solution at all — and we call it
      inconsistent. It is always worth scanning for such a row first, because a
      single contradiction settles the whole system at once. The second case is
      gentler: a row that collapses to all zeros,
      zero equals zero, {zeronote}. That row is simply redundant, a repeat of
      information already present, and it tells us nothing new. When that happens,
      some variable may lead no row; it is then a free variable, and the system has
      infinitely many solutions, each obtained by choosing a value for that free
      variable. So echelon form sorts every linear system into exactly three
      outcomes: a contradiction means no solutions, a free variable means
      infinitely many, and a complete staircase with neither means precisely one.
      In every case the procedure is identical — swap, scale, combine, reduce — and
      only the final shape of the staircase decides which of the three answers you
      have reached.
    animation:
      primitive: matrix
      params:
        rows: [[1, 1, 2], [2, 2, 5]]
      steps:
        - {id: drawC, action: draw, params: {rows: [[1, 1, 2], [2, 2, 5]]}}
        - {id: bad, action: combine, params: {target: 1, src: 0, k: -2}}
    board:
      - id: zeronote
        text: "0 = 1: no solution. 0 = 0: a free variable, infinitely many."
        color: orange

  - id: s7
    kind: end
    narration: >
      To summarise: Gauss's method clears each column with row operations until the
      system is a triangular staircase, then back-substitution reads off the answer
      — and the shape of the staircase tells you whether there is one solution,
      none, or infinitely many. Next: Describing the solution set — what a free
      variable means when a system has infinitely many solutions.
