schema_version: 1
id: LA-26
channel: chalk-and-vector
title: "Complex eigenvalues mean rotation: the geometry nobody shows you"
target_minutes: 9
source:
  book: "Linear Algebra (Jim Hefferon)"
  section: "Five.I Complex Vector Spaces"
