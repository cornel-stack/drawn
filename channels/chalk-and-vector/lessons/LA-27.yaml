# LA-27: The spectral theorem — why symmetric matrices are the nicest matrices.
# Hefferon, Linear Algebra, Topic: Orthonormal Matrices / Similarity (CC BY-SA 3.0).
# Completes the eigen arc. ~8 minutes.
# Colour: eigenvectors/orthogonal = blue, eigenvalues = red, symmetric/Q = green.
schema_version: 1
id: LA-27
channel: chalk-and-vector
title: "The spectral theorem: why symmetric matrices are the nicest matrices"
target_minutes: 8
source:
  book: "Linear Algebra (Jim Hefferon)"
  section: "Topic: Orthonormal Matrices (with Five.II Similarity)"
  license: "CC BY-SA 3.0"
  file: "hefferon-linear-algebra/025-topic-orthonormal-matrices.md"
  pages: "302-308"
