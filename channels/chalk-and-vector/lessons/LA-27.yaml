  kicker: "Linear Algebra"
  hook: "The matrices with no surprises"
  keyword: "no surprises"
publish:
  title: "The Spectral Theorem: Why Symmetric Matrices Are the Nicest"
  summary: >
    Symmetric matrices are the best-behaved objects in linear algebra: their
    eigenvalues are always real, their eigenvectors always perpendicular, and they
    diagonalise with a pure rotation. We show why the spectral theorem holds, what
    A = Q Lambda Q-transpose means geometrically, and work two examples.
  hashtags: ["#linearalgebra", "#mathematics", "#math"]
  tags:
    - spectral theorem
    - symmetric matrix
    - orthogonal diagonalisation
    - eigenvalues
    - eigenvectors
    - linear algebra
    - Hefferon

scenes:
  - id: s1
    kind: title
    narration: >
      Among all matrices, one family is so well-behaved it is a pure joy to work with: the symmetric ones,
      equal to their own transpose. Their eigenvalues are always real, their eigenvectors always
      perpendicular, and the result that guarantees this is the spectral theorem.

  - id: s2
    kind: diagram
    narration: >
      Here, {drawV1}, is what a symmetric matrix does: take its two eigenvectors, in blue, and the first thing
      to notice is that they meet at a perfect right angle, {drawV2}. For a symmetric matrix, eigenvectors
      always come out perpendicular. Along each one the matrix simply scales — it stretches the first by its
      eigenvalue, {drawAv1}, and the second by its own, {drawAv2}, with no rotation and no shear. A symmetric
      matrix is pure stretching along a set of mutually perpendicular axes. Compare this with the rotation of
      the last lesson, which turned every vector and had no real eigenvectors at all; the symmetric matrix is
      its complete opposite — it turns nothing, and its eigenvectors form a perfect perpendicular frame. The
      spectral theorem packages this, {spectralEq}: a symmetric matrix equals an orthogonal matrix Q, whose
      columns are those perpendicular unit eigenvectors, times a diagonal matrix of the real eigenvalues,
      times Q transposed. Because Q is orthogonal, its inverse is just its transpose, so the whole
      factorisation is a change into the eigenframe, a scaling, and a change back — the cleanest possible
      action a matrix can have.
    animation:
      primitive: vectors
      params:
        axes: {x: [-3, 3, 1], y: [-3, 3, 1]}
        vectors:
          v1: {to: [1.3, 1.3], color: blue, label: "v_{1}"}
          v2: {to: [1.3, -1.3], color: blue, label: "v_{2}"}
          Av1: {to: [2.6, 2.6], color: red, label: "\\lambda_1 v_{1}"}
          Av2: {to: [0.7, -0.7], color: red, label: "\\lambda_2 v_{2}"}
      steps:
        - {id: drawV1, action: draw, params: {name: v1}}
        - {id: drawV2, action: draw, params: {name: v2}}
        - {id: drawAv1, action: draw, params: {name: Av1}}
        - {id: drawAv2, action: draw, params: {name: Av2}}
    board:
      - id: spectralEq
        latex: "A = Q\\,\\Lambda\\,Q^{\\mathsf{T}}"
        say: "A equals Q, Lambda, Q transpose"
        color: green
        legend:
          - {sym: "Q", name: "orthonormal eigenvectors", unit: ""}
          - {sym: "\\Lambda", name: "diagonal of real eigenvalues", unit: ""}

  - id: s3
    kind: derivation
    narration: >
      Start from the definition, {symEq}: a matrix equal to its own transpose. Why are symmetric matrices so
      tame? Two facts follow, and they are the whole theorem. First, the eigenvalues are real, {realEq}.
      For a general matrix they can be complex, as a rotation showed, but a short argument with the transpose
      forces a symmetric matrix's eigenvalues to have no imaginary part at all — so a symmetric matrix never
      rotates. Second, eigenvectors belonging to different eigenvalues are orthogonal, {orthoEq}. Take two
      eigenvectors with different eigenvalues and feed them through the symmetry condition, and it drops out
      that their dot product must be zero — they are perpendicular, automatically, with no effort on your
      part. Put these together. A symmetric matrix has a full set of real eigenvalues and a perpendicular set
      of eigenvectors; normalise each to unit length and you have an orthonormal basis of eigenvectors.
      Collect those unit eigenvectors as the columns of a matrix Q, {buildEq}, and because its columns are
      orthonormal, Q is an orthogonal matrix: its transpose is its inverse. That single property makes the
      diagonalisation beautiful, {hl:buildEq}. Any diagonalisable matrix factors as P D P inverse, but for
      a symmetric one the P is orthogonal, so the awkward inverse becomes a simple transpose, and the
      decomposition is A equals Q Lambda Q transpose. This is orthogonal diagonalisation, and the spectral
      theorem says every real symmetric matrix admits it. Geometrically it is the statement we drew,
      {hl:orthoEq}: a symmetric matrix is a scaling along perpendicular axes, nothing more. And this is why
      symmetric matrices are everywhere in applied mathematics and physics. A covariance matrix is symmetric,
      {hl:symEq}, so its orthogonal eigenvectors are the principal components of data — the axes of greatest
      spread — which is the engine of principal component analysis. The inertia tensor of a spinning body is
      symmetric, {hl:realEq}, so every object has perpendicular principal axes about which it spins cleanly.
      The matrix of a quadratic form is symmetric too, {hl:orthoEq}, so every conic and quadric has
      perpendicular principal axes. Wherever a problem has an underlying symmetry — and energy, distance and
      correlation all produce symmetric matrices — the spectral theorem hands you a perpendicular frame,
      {hl:buildEq}, in which the problem falls apart into independent, one-dimensional pieces. The nicest
      matrices are the symmetric ones because they promise the nicest possible world, {hl:realEq}: real
      numbers, right angles, and pure stretching.
    board:
      - id: symEq
        latex: "A = A^{\\mathsf{T}}"
        say: "a symmetric matrix equals its own transpose"
        color: green
        box: true
      - id: realEq
        latex: "\\lambda \\in \\mathbb{R}"
        say: "all eigenvalues are real"
        color: red
      - id: orthoEq
        latex: "v_i \\cdot v_j = 0 \\ (i \\neq j)"
        say: "eigenvectors for different eigenvalues are orthogonal"
        color: blue
        box: true
      - id: buildEq
        latex: "Q = [\\,\\hat{v}_1 \\ \\hat{v}_2 \\ \\cdots\\,], \\quad Q^{\\mathsf{T}} = Q^{-1}"
        say: "Q holds the unit eigenvectors as columns, and its transpose is its inverse"
        color: green

  - id: s4
    kind: problem
    narration: >
      Perpendicular by guarantee. {statement} A symmetric matrix has two eigenvectors, {given}; confirm they
      are orthogonal. {find} Two vectors are orthogonal exactly when their dot product is zero, so dot the two
      eigenvectors, {step1}: one times one, plus one times minus one. That is one minus one, {step2}, which is
      zero, {answer}. They are perpendicular — and this was no accident of the chosen numbers. Because the
      matrix is symmetric, its eigenvectors for distinct eigenvalues were perpendicular before we computed
      anything. Symmetry forces the right angle.
    board:
      - id: statement
        text: "Eigenvectors of a symmetric matrix."
      - id: given
        latex: "v_1 = \\begin{pmatrix}1\\\\1\\end{pmatrix},\\quad v_2 = \\begin{pmatrix}1\\\\-1\\end{pmatrix}"
        say: "eigenvectors one, one and one, minus one"
        role: given
      - id: find
        text: "Check v₁·v₂ = 0."
        role: find
      - id: step1
        latex: "v_1 \\cdot v_2 = 1(1) + 1(-1)"
        say: "the dot product is one times one, plus one times minus one"
        role: step
        color: blue
      - id: step2
        latex: "= 1 - 1"
        say: "equals one minus one"
        role: step
        color: red
      - id: answer
        latex: "v_1 \\cdot v_2 = 0 \\;\\checkmark"
        say: "the dot product is zero, so they are perpendicular"
        role: answer
        box: true
        color: blue
    check:
      expr: "1*1 + 1*(-1)"
      value: 0
      unit: ""
      tol: 0.01

  - id: s5
    kind: problem
    narration: >
      Making Q orthonormal. {statement2} To build the orthogonal matrix Q we need unit eigenvectors, so take
      the first eigenvector and normalise it, {given2}. {find2} Divide the vector by its length. Its length is
      the square root of one squared plus one squared, which is the square root of two, {step1b}. So the unit
      eigenvector is one over root two, one over root two. Check it really has length one, {step2b}: a half
      plus a half. That is one, {answer2}, so the vector is now a unit vector, ready to be a column of Q.
      Normalise the second eigenvector the same way, place both as columns, and Q is the orthogonal matrix
      that diagonalises the symmetric matrix — pure rotation in, scaling by the eigenvalues, rotation back.
    board:
      - id: statement2
        text: "Normalising an eigenvector for Q."
      - id: given2
        latex: "v_1 = \\begin{pmatrix}1\\\\1\\end{pmatrix},\\quad \\|v_1\\| = \\sqrt{2}"
        say: "the eigenvector one, one has length root two"
        role: given
      - id: find2
        text: "Find the unit eigenvector and check |·|=1."
        role: find
      - id: step1b
        latex: "\\hat{v}_1 = \\dfrac{1}{\\sqrt{2}}\\begin{pmatrix}1\\\\1\\end{pmatrix}"
        say: "the unit eigenvector is one over root two times one, one"
        role: step
        color: green
      - id: step2b
        latex: "\\|\\hat{v}_1\\|^2 = \\tfrac{1}{2} + \\tfrac{1}{2}"
        say: "its length squared is a half plus a half"
        role: step
        color: blue
      - id: answer2
        latex: "\\|\\hat{v}_1\\| = 1 \\;\\checkmark"
        say: "the length is one, a unit vector"
        role: answer
        box: true
        color: green
    check:
      expr: "(1/np.sqrt(2))**2 + (1/np.sqrt(2))**2"
      value: 1
      unit: ""
      tol: 0.01

  - id: s6
    kind: end
    narration: >
      To summarise: a symmetric matrix equals its transpose, and the spectral theorem guarantees it has real
      eigenvalues and perpendicular eigenvectors, so it diagonalises orthogonally as Q Lambda Q transpose with
      Q an orthonormal eigenframe. Geometrically it is pure scaling along perpendicular axes — no rotation, no
      complexity — which is why symmetric matrices underlie principal component analysis, principal axes and
      quadratic forms. Next: The singular value decomposition — every matrix is a rotate, a stretch, and a
      rotate.
