# DE-01: What is a differential equation?
# OpenStax Calculus Volume 2 §4.1 Basics of Differential Equations (CC BY 4.0).
# ~7 minutes. Source swapped from Trench (CC BY-NC-SA) to OpenStax for the
# CC BY policy, as MI-01 was.
# Colour discipline: solution curve y = blue, slope/derivative = orange,
# initial condition / particular solution = green, the rate constant k = purple.
schema_version: 1
id: DE-01
channel: chalk-and-vector
title: "What is a differential equation? (and why physics is written in them)"
target_minutes: 7
source:
  book: "OpenStax Calculus Volume 2"
  section: "§4.1 Basics of Differential Equations"
  license: "CC BY 4.0"
  file: "openstax-calculus-vol2/036-4-1-basics-of-differential-equations.md"
  pages: "308-316"
thumbnail:
  kicker: "Calculus"
  hook: "The equation that solves itself"
  keyword: "solves itself"
publish:
  title: "Differential Equations Explained: Why All of Physics Is Written in Them"
  summary: >
    A differential equation links a function to its own rate of change. This
    lesson explains what that means, what it is to solve one, the difference
    between the general family of solutions and a single particular solution
    fixed by an initial condition, and why Newton's second law and exponential
    growth are differential equations in disguise.
  hashtags: ["#calculus", "#differentialequations", "#mathematics"]
