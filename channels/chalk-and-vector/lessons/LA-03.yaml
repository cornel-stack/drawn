# LA-03: Reduced row echelon form — what the zeros are telling you.
# Hefferon, Linear Algebra §1.III Reduced Echelon Form (CC BY-SA 3.0). ~7 minutes.
# Colour discipline: pivot / leading 1 = blue, row being operated on = orange,
# created zeros / solution = green, free variable = yellow.
schema_version: 1
id: LA-03
channel: chalk-and-vector
title: "Row echelon form explained: what the zeros are telling you"
target_minutes: 7
source:
  book: "Linear Algebra (Jim Hefferon)"
  section: "§1.III Reduced Echelon Form"
  license: "CC BY-SA 3.0"
  file: "hefferon-linear-algebra/003-reduced-echelon-form.md"
  pages: "50-62"
thumbnail:
  kicker: "Linear Algebra"
  hook: "The zeros are talking"
  keyword: "zeros"
publish:
  title: "Reduced Row Echelon Form: What the Zeros Are Telling You"
  summary: >
    Reduced echelon form is echelon form taken one step further: every leading
    entry is a 1 and stands alone in its column, so the solution can be read
    straight off the matrix. We drive a system from echelon form to reduced
    echelon form one row operation at a time, then show what a zero row and a
    free column really mean — and why the reduced form is unique.
  hashtags: ["#linearalgebra", "#mathematics", "#math"]
  tags:
    - linear algebra
    - reduced row echelon form
    - RREF
    - Gauss-Jordan elimination
    - echelon form
    - pivot
    - free variable
    - rank

scenes:
  - id: s1
    kind: title
    narration: >
      Gaussian elimination leaves a system in echelon form — a staircase. Push a
      little further and the answer falls out of the matrix with no work at all.
      That final form is what this lesson is about.

  - id: s2
    kind: diagram
    narration: >
      Start here, {drawE}: echelon form, where the previous lesson left us — a
      staircase, with a leading entry in each row and zeros below it. The three
      leading entries sit on the diagonal, {hpz}. Reduced echelon form asks for
      two more things of every leading entry, {rrefDef}: it must be a one, and it
      must be the only non-zero number in its whole column. Reaching it is just a
      few more row operations. First make the leading entries into ones. The bottom
      pivot is a two, so halve that row, {mk1}, and it becomes a leading one. The
      other two leading entries are already ones, {hp1}. Now clear each column
      above its leading one, working upwards. Use the bottom row to wipe out the
      entry above it in the z column, {clr_z2}, and again higher up, {clr_z1}:
      those entries drop to zero. Finally use the middle row to clear the last
      entry in the top row, {clr_y1}. What is left, {hfinal}, is as clean as a
      matrix gets — ones on the diagonal, zeros everywhere else on the left.
    animation:
      primitive: matrix
      params:
        rows: [[1, 2, -1, -1], [0, 1, 3, 5], [0, 0, 2, 4]]
      steps:
        - {id: drawE, action: draw, params: {rows: [[1, 2, -1, -1], [0, 1, 3, 5], [0, 0, 2, 4]]}}
        - {id: hpz, action: highlight, params: {i: 2, col: 2}}
        - {id: mk1, action: scale, params: {i: 2, k: 0.5}}
        - {id: hp1, action: highlight, params: {i: 1, col: 1}}
        - {id: clr_z2, action: combine, params: {target: 1, src: 2, k: -3}}
        - {id: clr_z1, action: combine, params: {target: 0, src: 2, k: 1}}
        - {id: clr_y1, action: combine, params: {target: 0, src: 1, k: -2}}
        - {id: hfinal, action: highlight, params: {i: 0, col: 0}}
    board:
      - id: rrefDef
        text: "Reduced echelon form: each leading entry is a 1, alone in its column."
        color: blue

  - id: s3
    kind: derivation
    narration: >
      Read it straight off, {soln}. With ones on the diagonal and zeros beside
      them, each row now says one variable equals one number: x is three, y is
      minus one, z is two. No back-substitution, no rearranging — the column of
      constants is the answer. That is the whole point of the extra arithmetic.
      Now, what do the zeros tell you? Count the rows that are not all zero; that
      count is the rank, {rankEq}, and it is the number of genuine constraints the
      system carries. A row that collapses to all zeros is a redundant equation,
      repeating what the others already said, so it imposes nothing. And a column
      with no leading one belongs to a free variable. Suppose z leads no row,
      {freeSol}: then x and y are pinned in terms of z, and z itself is free to be
      anything, so the system has infinitely many solutions. Written as a vector,
      {vecForm}, every solution is one fixed point plus any multiple of a single
      direction — a line of solutions. One last fact makes all of this trustworthy:
      whatever order you do the operations in, the reduced echelon form you reach is
      unique, so these conclusions never depend on the path you took. In fact the
      reduced form sorts every system at a glance into the three cases from the last
      lesson: a contradictory row means no solution, a free column means infinitely
      many, and a leading one in every column means exactly one — now read off
      directly, with nothing left to compute.
    board:
      - id: soln
        latex: "x = 3, \\quad y = -1, \\quad z = 2"
        say: "x equals three, y equals minus one, z equals two"
        color: green
        box: true
      - id: rankEq
        latex: "\\operatorname{rank} = \\#\\,\\text{leading entries} = \\#\\,\\text{non-zero rows}"
        say: "the rank is the number of leading entries, which is the number of non-zero rows"
        color: blue
      - id: freeSol
        latex: "x = 5 - 2z, \\quad y = 3 + z, \\quad z \\text{ free}"
        say: "x equals five minus two z, y equals three plus z, and z is free"
        color: yellow
      - id: vecForm
        latex: "\\begin{pmatrix}x\\\\y\\\\z\\end{pmatrix} = \\begin{pmatrix}5\\\\3\\\\0\\end{pmatrix} + z\\begin{pmatrix}-2\\\\1\\\\1\\end{pmatrix}"
        say: "the solution vector equals five, three, zero, plus z times minus two, one, one"
        color: yellow

  - id: s4
    kind: problem
    narration: >
      A unique answer first. {statement} Three equations are given,
      {given}; reduce and read off the solution. {find} Elimination clears the
      first column, then scaling the pivots to ones and clearing upwards gives the
      reduced form, {step1}. Each row then reads a single variable, {step2}, and the
      constants column hands you the answer directly. The solution is two, three,
      minus one, {answer} — one point, because every variable leads a row and none
      is free.
    board:
      - id: statement
        text: "Reduce to RREF and read off the solution."
      - id: given
        latex: "x + y + z = 4, \\quad 2x - y + z = 0, \\quad x + 2y - z = 9"
        say: "x plus y plus z equals four; two x minus y plus z equals zero; x plus two y minus z equals nine"
        role: given
      - id: find
        text: "Find (x, y, z)."
        role: find
      - id: step1
        latex: "\\xrightarrow{\\text{RREF}} \\begin{pmatrix}1&0&0\\\\0&1&0\\\\0&0&1\\end{pmatrix}\\!\\begin{pmatrix}2\\\\3\\\\-1\\end{pmatrix}"
        say: "reducing to reduced echelon form gives the identity on the left and two, three, minus one on the right"
        role: step
        color: blue
      - id: step2
        latex: "x = 2, \\quad y = 3, \\quad z = -1"
        say: "x equals two, y equals three, z equals minus one"
        role: step
        color: green
      - id: answer
        latex: "(x, y, z) = (2, 3, -1)"
        say: "the solution is two, three, minus one"
        role: answer
        box: true
        color: green
    check:
      expr: "np.linalg.solve([[1,1,1],[2,-1,1],[1,2,-1]], [4,0,9])[0]"
      value: 2.0
      unit: ""
      tol: 0.01

  - id: s5
    kind: problem
    narration: >
      Now a free variable. {statement2} Here is a second system, {given2};
      reduce it. {find2} Eliminating the first column makes rows two and three
      identical, so subtracting them leaves a row of all zeros, {step1b} — a
      redundant equation, telling us the three were never truly independent. The
      reduced form has leading ones in the x and y columns but none in the z
      column, {step2b}, so z is the free variable. Solving the two real rows for x
      and y in terms of z gives the solution set, {answer2}: x is five minus two z,
      y is three plus z, and z is anything you like. Put z equal to one, for
      instance, and the triple three, four, one satisfies all three original
      equations.
    board:
      - id: statement2
        text: "Reduce to RREF and describe all solutions."
      - id: given2
        latex: "x + y + z = 8, \\quad 2x - y + 5z = 7, \\quad 3x + 6z = 15"
        say: "x plus y plus z equals eight; two x minus y plus five z equals seven; three x plus six z equals fifteen"
        role: given
      - id: find2
        text: "Describe the full solution set."
        role: find
      - id: step1b
        latex: "\\rho_3 - \\rho_2 \\;\\Rightarrow\\; (0\\ 0\\ 0 \\mid 0)"
        say: "row three minus row two gives a row of all zeros"
        role: step
        color: green
      - id: step2b
        latex: "\\begin{pmatrix}1&0&2\\\\0&1&-1\\\\0&0&0\\end{pmatrix}\\!\\begin{pmatrix}5\\\\3\\\\0\\end{pmatrix}"
        say: "the reduced form has leading ones in the x and y columns, and a zero row"
        role: step
        color: yellow
      - id: answer2
        latex: "x = 5 - 2z, \\quad y = 3 + z, \\quad z \\text{ free}"
        say: "x equals five minus two z, y equals three plus z, z free"
        role: answer
        box: true
        color: yellow
    check:
      expr: "5 - 2*1"
      value: 3.0
      unit: ""
      tol: 0.01

  - id: s6
    kind: end
    narration: >
      To summarise: reduced echelon form makes every leading entry a one, alone in
      its column, so you read the solution straight off — a zero row is a redundant
      equation, and a column with no leading one is a free variable. Next: Why
      solution sets are lines, planes and points — particular plus homogeneous.
