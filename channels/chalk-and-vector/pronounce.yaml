  # terms the TTS tends to mangle
  "eigen": "eye-gen"
  "eigenvalue": "eye-gen-value"
  "eigenvalues": "eye-gen-values"
  "eigenvector": "eye-gen-vector"
  "eigenvectors": "eye-gen-vectors"
  "homomorphism": "homo-morph-ism"
  "isomorphism": "eye-so-morph-ism"
  "orthogonal": "or-thog-onal"
  "orthonormal": "or-tho-normal"
