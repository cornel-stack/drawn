# Chalk & Vector — how symbols and terms are spoken.
# Applied to `say` fields and narration before TTS. Longest match wins. Keep it
# complete as lessons add symbols (the linter warns about any speakable LaTeX
# symbol or proper noun with no entry). Hear it with `just pronounce-check`.
map:
  # Greek letters
  "\\alpha": "alpha"
  "\\beta": "beta"
  "\\gamma": "gamma"
  "\\delta": "delta"
  "\\Delta": "delta"
  "\\epsilon": "epsilon"
  "\\varepsilon": "epsilon"
  "\\zeta": "zeta"
  "\\eta": "eta"
  "\\theta": "theta"
  "\\vartheta": "theta"
  "\\kappa": "kappa"
  "\\lambda": "lambda"
  "\\Lambda": "lambda"
  "\\mu": "mu"
  "\\nu": "nu"
  "\\xi": "ksai"
  "\\pi": "pi"
  "\\rho": "rho"
  "\\sigma": "sigma"
  "\\Sigma": "sigma"
  "\\tau": "tau"
  "\\phi": "phi"
  "\\varphi": "phi"
  "\\Phi": "phi"
  "\\chi": "kai"
  "\\psi": "sigh"
  "\\Psi": "sigh"
  "\\omega": "omega"
  "\\Omega": "omega"
  "\\Gamma": "gamma"
  "\\Theta": "theta"
  # operators and relations
  "\\partial": "partial"
  "\\nabla": "del"
  "\\times": "times"
  "\\cdot": "dot"
  "\\sum": "sum"
  "\\prod": "product"
  "\\int": "integral"
  "\\infty": "infinity"
  "\\approx": "approximately"
  "\\leq": "less than or equal to"
  "\\geq": "greater than or equal to"
  "\\neq": "not equal to"
  "\\pm": "plus or minus"
  "\\propto": "proportional to"
  "\\to": "goes to"
  "\\rightarrow": "maps to"
  "\\Rightarrow": "implies"
  "\\mapsto": "maps to"
  "\\hat": "hat"
  "\\bar": "bar"
  "\\vec": "vector"
  # named people and terms
  "Gauss": "gowss"
  "Gaussian": "gowss-ian"
  "Euler": "oiler"
  "Bernoulli": "ber-noo-lee"
  "Laplace": "la-plahss"
  "Fourier": "foor-ee-ay"
  "Cauchy": "koh-shee"
  "Schwarz": "shvarts"
  "Schmidt": "shmit"
  "Wronskian": "vron-skee-an"
  "Jacobian": "ja-koh-bee-an"
  "Hermitian": "her-mish-an"
  "Cramer": "kray-mer"
  "Vandermonde": "van-der-mond"
