name: chalk-and-vector
display_name: "Chalk & Vector"
board:
  style: board           # pure black board, white ink (Phase 1.5 legibility bar)
  background: "#000000"
  ink: "#ffffff"
  accent: "#5aa9ff"       # default accent (blue)
# Palette entries are ACCENTS ONLY (vectors, highlights, boxes) — never base ink.
palette:
  - "#5aa9ff"            # blue
  - "#ffd24a"            # yellow
  - "#5fd38a"            # green
  - "#ff6b6b"            # red
accents:
  blue: "#5aa9ff"
  orange: "#ff9f43"
  green: "#5fd38a"
  red: "#ff6b6b"
  purple: "#c08cff"
  yellow: "#ffd24a"
font:
  handwriting: Kalam
  file: assets/fonts/Kalam-Regular.ttf
voice:
  service: kokoro
  kokoro_voice: bm_george        # British male
  edge_voice: en-GB-RyanNeural   # fallback
  speed: 0.92
intro_seconds: 2.0
outro_seconds: 3.0
