# Pen & Pendulum — how symbols and terms are spoken.
# Applied to `say` fields and narration before TTS. Keys may be LaTeX commands
# or plain terms; longest match wins. Keep this complete as new lessons add
# symbols (the linter warns about any speakable LaTeX symbol or proper noun with
# no entry). Hear the whole map read aloud with `just pronounce-check`.
map:
  # Greek letters
  "\\alpha": "alpha"
  "\\beta": "beta"
  "\\gamma": "gamma"
  "\\delta": "delta"
  "\\Delta": "delta"
  "\\epsilon": "epsilon"
  "\\varepsilon": "epsilon"
  "\\zeta": "zeta"
  "\\eta": "eta"
  "\\theta": "theta"
  "\\vartheta": "theta"
  "\\kappa": "kappa"
  "\\lambda": "lambda"
  "\\mu": "mu"
  "\\nu": "nu"
  "\\xi": "ksai"
  "\\pi": "pi"
  "\\rho": "rho"
  "\\sigma": "sigma"
  "\\Sigma": "sigma"
  "\\tau": "tau"
  "\\upsilon": "upsilon"
  "\\phi": "phi"
  "\\varphi": "phi"
  "\\Phi": "phi"
  "\\chi": "kai"
  "\\psi": "sigh"
  "\\Psi": "sigh"
  "\\omega": "omega"
  "\\Omega": "omega"
  "\\Gamma": "gamma"
  "\\Theta": "theta"
  "\\Lambda": "lambda"
  # operators and relations
