# Pen & Pendulum — how symbols and terms are spoken.
# Applied to `say` fields and narration before TTS. Keys may be LaTeX commands
# or plain terms; longest match wins. Keep this complete as new lessons add
# symbols (the linter warns about any speakable LaTeX symbol with no entry).
map:
  "\\omega": "omega"
  "\\Omega": "omega"
  "\\tau": "tau"
  "\\theta": "theta"
  "\\phi": "phi"
  "\\varphi": "phi"
  "\\mu": "mu"
  "\\rho": "rho"
  "\\sigma": "sigma"
  "\\lambda": "lambda"
  "\\alpha": "alpha"
  "\\beta": "beta"
  "\\gamma": "gamma"
  "\\delta": "delta"
  "\\Delta": "delta"
  "\\epsilon": "epsilon"
  "\\varepsilon": "epsilon"
  "\\pi": "pi"
  "\\nu": "nu"
  "\\eta": "eta"
  "\\Sigma": "sigma"
  "\\partial": "partial"
  "\\nabla": "del"
  "\\times": "cross"
  "\\cdot": "dot"
  "\\sum": "sum"
  "\\int": "integral"
  "\\infty": "infinity"
  "\\approx": "approximately"
  "\\leq": "less than or equal to"
  "\\geq": "greater than or equal to"
  "\\neq": "not equal to"
  "\\pm": "plus or minus"
  "\\propto": "proportional to"
  "\\to": "goes to"
  "\\rightarrow": "goes to"
  "\\hat": "hat"
  "\\bar": "bar"
