name: pen-and-pendulum
display_name: "Pen & Pendulum"
board:
  style: board           # pure black board, white ink (Phase 1.5 legibility bar)
  background: "#000000"
  ink: "#ffffff"
  accent: "#ff9f43"       # default accent (orange)
# Palette entries are ACCENTS ONLY (vectors, highlights, boxes) — never base ink.
palette:
  - "#5aa9ff"            # blue
  - "#ff9f43"            # orange
  - "#5fd38a"            # green
  - "#ff6b6b"            # red
accents:
  blue: "#5aa9ff"
  orange: "#ff9f43"
  green: "#5fd38a"
  red: "#ff6b6b"
  purple: "#c08cff"
  yellow: "#ffd24a"
font:
  handwriting: Kalam
  file: assets/fonts/Kalam-Regular.ttf
voice:
  service: kokoro
  kokoro_voice: bm_lewis           # British male
  edge_voice: en-GB-ThomasNeural   # fallback
  speed: 1.0
intro_seconds: 2.0
outro_seconds: 3.0
