publish:
  title: "ALL of Magnetism and Induction in 15 Minutes"
  summary: >
    A single fast tour of the second half of electromagnetism: the magnetic force on
    moving charges and currents, the fields that currents create, Ampere's law,
    magnetic flux, and the induction laws of Faraday and Lenz — each idea, its key
    equation, and how they connect. The perfect revision pass. Three worked examples.
  hashtags: ["#physics", "#electromagnetism", "#revision"]
