# ME-01: Vectors — components, dot and cross product.
# OpenStax University Physics Vol. 1 Ch.2 (CC BY 4.0). ~7 minutes.
# Colour discipline: A=blue, B=purple, x-parts=green, y-parts=orange, results=green.
schema_version: 1
id: ME-01
channel: pen-and-pendulum
title: "Vectors: components, dot and cross product"
target_minutes: 6
source:
  book: "OpenStax University Physics Vol. 1"
  section: "Ch.2 Vectors"
  license: "CC BY 4.0"

scenes:
  - id: s1
    kind: title
    narration: >
      Almost everything in physics carries both a size and a direction: a push,
      a velocity, an electric field.

  - id: s2
    kind: diagram
    narration: >
      Draw a vector as an arrow, {drawA}: its length is the magnitude and the
      way it points is the direction. A scalar, by contrast, is a bare number
      with no direction at all — mass, temperature, energy. On a set of axes the
      arrow casts a shadow onto each axis, {splitA}. These shadows are the
      components: the horizontal part and the vertical part that, added nose to
      tail, rebuild the arrow exactly. In symbols we write the vector as its
      components along the unit vectors i and j, {compEq}, where each unit vector
      is just a step of length one along an axis. Splitting a vector this way is
      the single most useful habit in the subject, because the two directions
      behave independently: a force up a slope and a force across it never
      interfere, so once we have components, every equation becomes ordinary
      arithmetic done one axis at a time.
    animation:
      primitive: vectors
      params:
        axes: {x: [-1, 5, 1], y: [-1, 4, 1], x_length: 7.0, y_length: 4.0, center: [-0.4, 0.4, 0]}
        vectors:
          A: {to: [4, 3], color: blue, label: "A"}
      steps:
        - {id: drawA, action: draw, params: {name: A}}
        - {id: splitA, action: components, params: {name: A, cx: green, cy: orange}}
    board:
      - id: compEq
        latex: "\\vec{A} = A_x\\,\\hat{i} + A_y\\,\\hat{j}"
        say: "A equals A x i hat plus A y j hat"
        color: blue
        tex_colors:
          "A_x": green
          "A_y": orange

  - id: s3
    kind: diagram
    narration: >
      Take that arrow once more, {drawB}. Because its two components meet at a
      right angle, {splitB}, the arrow and its shadows form a right-angled
      triangle. Pythagoras then hands us the magnitude straight away, {magEq}:
      the length is the square root of the sum of the squared components. The
      direction comes from the same triangle: the tangent of the angle is the
      vertical part over the horizontal part, {dirEq}. So from two numbers we
      recover both how long the arrow is and which way it leans, and from a
      length and an angle we can go back the other way. A quick example:
      components of three across and four up give a length of exactly five,
      since nine plus sixteen is twenty-five. Magnitude and direction,
      components and angle are two languages for the one arrow, and fluent
      physics means switching between them without thinking.
    animation:
      primitive: vectors
      params:
        axes: {x: [-1, 5, 1], y: [-1, 4, 1], x_length: 7.0, y_length: 4.0, center: [-0.4, 0.4, 0]}
        vectors:
          A: {to: [4, 3], color: blue, label: "A"}
      steps:
        - {id: drawB, action: draw, params: {name: A}}
        - {id: splitB, action: components, params: {name: A, cx: green, cy: orange}}
    board:
      - id: magEq
        latex: "A = \\sqrt{A_x^2 + A_y^2}"
        say: "A equals the square root of A x squared plus A y squared"
        color: blue
      - id: dirEq
        latex: "\\tan\\theta = \\dfrac{A_y}{A_x}"
        say: "tan theta equals A y over A x"
        color: yellow

  - id: s4
    kind: diagram
    narration: >
      Here are two vectors, {drawC} and {drawD}. To add them geometrically,
      slide the second arrow so its tail sits on the first one's tip, and the
      sum is the single arrow from the very start to the very end, {addCD}. That
      is the nose to tail rule, and it is exactly how displacements and forces
      combine. With
      components it is even easier: the sum's horizontal part is just the two
      horizontal parts added, and likewise for the vertical, {sumEq}. The
      picture and the arithmetic always agree, which is the whole point of
      working in components. The same two arrows drawn from a shared corner span
      a parallelogram, and the sum is its diagonal — nose to tail and the
      parallelogram rule are one idea seen two ways. To subtract, reverse the
      second arrow and add: flipping an arrow negates both components, nothing
      more.
    animation:
      primitive: vectors
      params:
        axes: {x: [-1, 6, 1], y: [-1, 5, 1], x_length: 7.2, y_length: 4.1, center: [-0.4, 0.4, 0]}
        vectors:
          A: {to: [3, 1], color: blue, label: "A"}
          B: {to: [1, 3], color: purple, label: "B"}
      steps:
        - {id: drawC, action: draw, params: {name: A}}
        - {id: drawD, action: draw, params: {name: B}}
        - {id: addCD, action: add_tip_to_tail, params: {a: A, b: B, result: C, color: green}}
    board:
      - id: sumEq
        latex: "\\vec{C} = \\vec{A} + \\vec{B}"
        say: "C equals A plus B"
        color: green

  - id: s5
    kind: diagram
    narration: >
      Here are two vectors from a shared corner, {drawE} and {drawF}. The first
      product asks how much they point the same way, so drop one onto the other,
      {dotG}: the shaded stretch is the projection, how much of the second lies
      along the first. Multiply that projection by the first vector's
      length and you get the dot product, {dotEq}. It equals the two magnitudes
      times the cosine of the angle between them, and in components it is simply
      the matching parts multiplied and summed. The answer is a single number, a
      scalar, and it is largest when the vectors are parallel and zero when they
      are perpendicular. This is exactly the work done by a force: only the part
      of the force along the motion counts, so a positive dot product means the
      force speeds you up, a negative one means it slows you down, and a right
      angle means it does no work at all — which is why a satellite coasts
      forever on a circular orbit.
    animation:
      primitive: vectors
      params:
        axes: {x: [-1, 6, 1], y: [-1, 5, 1], x_length: 7.2, y_length: 4.1, center: [-0.4, 0.4, 0]}
        vectors:
          A: {to: [4, 1], color: blue, label: "A"}
          B: {to: [2, 3], color: purple, label: "B"}
      steps:
        - {id: drawE, action: draw, params: {name: A}}
        - {id: drawF, action: draw, params: {name: B}}
        - {id: dotG, action: dot_product, params: {a: A, b: B, color: green}}
    board:
      - id: dotEq
        latex: "\\vec{A}\\cdot\\vec{B} = AB\\cos\\theta = A_xB_x + A_yB_y"
        say: "A dot B equals A B cosine theta, equals A x B x plus A y B y"
        color: green

  - id: s6
    kind: diagram
    narration: >
      Place two vectors in a plane, {drawH} {drawI}. The second product asks
      something different from the first: how much they fail to point the same
      way. Its answer, the cross product, is a brand new vector standing straight
      up out of that plane, {crossJ}. Its length is the two magnitudes times the sine of the angle, the
      area of the parallelogram they span, {crossEq}. Its direction follows the
      right-hand rule: curl your fingers from the first vector to the second and
      your thumb points the way. Unlike the dot product, the result is itself a
      vector, and it vanishes when the two are parallel. Swap the order and the
      new vector flips to point the other way, so the cross product cares about
      sense as well as size. Torque and angular momentum are both cross products,
      which is exactly why a spinning wheel precesses instead of falling.
    animation:
      primitive: vectors3d
      params:
        show_axes: true
        vectors:
          A: {to: [2.4, 0.6, 0], color: blue, label: "A"}
          B: {to: [0.6, 2.4, 0], color: purple, label: "B"}
      steps:
        - {id: drawH, action: draw, params: {name: A}}
        - {id: drawI, action: draw, params: {name: B}}
        - {id: crossJ, action: cross, params: {a: A, b: B, color: green, label: "A\\times B"}}
    board:
      - id: crossEq
        latex: "|\\vec{A}\\times\\vec{B}| = AB\\sin\\theta"
        say: "the magnitude of A cross B equals A B sine theta"
        color: green

  - id: s7
    kind: summary
    narration: >
      So a vector splits into components, {recap}; its length and angle come
      straight from them; vectors add nose to tail or part by part; the dot
      product measures alignment and returns a number; and the cross product
      measures twist and returns a perpendicular vector. Next, in EM-01, we put
      the dot and cross products to work on Coulomb's law.
    animation:
      primitive: vectors
      params:
        origin: [3.4, -1.5]
        scale: 0.5
        vectors:
          R: {to: [3.0, 2.2], color: blue, label: "A"}
      steps:
        - {id: recap, action: draw, params: {name: R}}
    board: []

  - id: s8
    kind: end
    narration: ""
    board: []
