# ME-07: Newton's three laws, properly — what each one actually says.
# OpenStax University Physics Vol. 1, §5.2-5.5 Newton's Laws (CC BY 4.0). ~7 minutes.
# Colour: force = blue, acceleration = green, mass = orange, reaction = red.
schema_version: 1
id: ME-07
channel: pen-and-pendulum
title: "Newton's three laws, properly: what each one actually says"
target_minutes: 7
source:
  book: "University Physics Volume 1 (OpenStax)"
  section: "§5.2-5.5 Newton's Laws of Motion"
  license: "CC BY 4.0"
  file: "university-physics-vol1/040-5-3-newton-s-second-law.md"
  pages: "170-185"
thumbnail:
  kicker: "Mechanics"
  hook: "Force doesn't cause motion"
  keyword: "doesn't cause motion"
publish:
  title: "Newton's Three Laws, Properly Explained: What Each One Really Says"
  summary: >
    Everyone can recite Newton's laws; far fewer understand what they actually
    claim. We clear up the deep points — that force causes a change in motion, not
    motion itself; that mass is resistance to acceleration; and that action-reaction
    pairs act on different bodies and never cancel. Two worked examples.
  hashtags: ["#physics", "#mechanics", "#newton"]
  tags:
    - Newton's laws
    - force
