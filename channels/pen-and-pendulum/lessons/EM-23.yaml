# OpenStax University Physics Vol. 2, Ch.5-10 (Coulomb's law through DC circuits),
# CC BY 4.0. A brisk comprehensive survey. ~15 minutes.
# Colour: charge/field = blue, potential = orange, capacitance = green, current/circuits = red.
schema_version: 1
id: EM-23
channel: pen-and-pendulum
title: "ALL of Electrostatics & Circuits in 15 minutes"
target_minutes: 15
