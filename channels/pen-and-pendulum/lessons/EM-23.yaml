  keyword: "Six chapters"
publish:
  title: "ALL of Electrostatics and Circuits in 15 Minutes"
  summary: >
    A single, fast tour of the whole first half of electromagnetism: Coulomb's law,
    the electric field, Gauss's law, potential, capacitance, current, resistance and
    DC circuits — each idea, its key equation, and how they connect. The perfect
    revision pass before an exam. Two worked examples tie it together.
