# ME-25: Gyroscopic precession — Phase 1.5 bar.
# Black board, white ink, coloured accents (L=blue, tau/dL=orange, Omega=green).
# Every non-end scene is animated; ~2 minutes.
schema_version: 1
id: ME-25
channel: pen-and-pendulum
title: "Gyroscopic precession: why the spinning wheel refuses to fall"
target_minutes: 2
source:
  book: "OpenStax University Physics Vol. 1"
  section: "§11.4 Precession of a gyroscope"
  license: "CC BY 4.0"

scenes:
  - id: s1
    kind: title
    narration: >
      A bicycle wheel spins fast on the end of its axle, {wheelOn}, and instead
      of toppling over it simply hangs there and slowly turns. The reason is one
      of the most beautiful arguments in all of mechanics.
    animation:
      primitive: wheel
      params:
        radius: 0.9
        spokes: 8
        color: blue
        position: [4.6, -2.3]
      steps:
        - {id: wheelOn, action: appear, params: {rate: 5.0}}

  - id: s2
    kind: diagram
    narration: >
      Set the wheel spinning fast about its axle. Because it spins it carries
      angular momentum: a vector pointing straight along the axle, {showL}. The
      faster the spin, the longer that arrow. Hold that picture — a spinning
      wheel is really an arrow of angular momentum.
    animation:
      primitive: gyroscope
      steps:
        - {id: showL, action: draw_L, params: {color: blue}}

  - id: s3
    kind: diagram
    narration: >
      Now let gravity act. It pulls down on the wheel's centre of mass, out at
      the far end of the axle. About the pivot that downward pull makes a
      torque, {showTau}, and crucially this torque points horizontally, at right
      angles to the angular momentum, not downwards.
    animation:
      primitive: gyroscope
      steps:
        - {id: showTau, action: draw_torque, params: {color: orange}}

  - id: s4
    kind: diagram
    narration: >
      Torque is the rate of change of angular momentum, so in a small time it
      adds a little sideways piece to our arrow, {addDL}. The arrow does not
      grow or shrink; it is only nudged sideways, swinging towards a new
      direction in the horizontal plane.
    animation:
      primitive: gyroscope
      steps:
        - {id: addDL, action: add_dL, params: {color: orange}}

  - id: s5
    kind: diagram
    narration: >
      Repeat that nudge moment after moment and the axle swings steadily around
      the vertical, tracing out a cone, {precess}. This slow circling is
      precession: the wheel never falls because its fall is forever being turned
      into a turn.
    animation:
      primitive: gyroscope
      steps:
        - {id: precess, action: precess, params: {turns: 1.0}}

  - id: s6
    kind: diagram
    narration: >
      As it keeps circling, {precess6}, put some numbers to it. The torque has
      size r m g, and it turns an angular momentum of size I omega. Divide the
      one by the other and the precession rate drops straight out, {omega}. So
      the faster it spins, the slower it precesses, {takeaway}. Next, in ME-26,
      rolling without slipping.
    animation:
      primitive: gyroscope
      steps:
        - {id: precess6, action: precess, params: {turns: 2.0, orbit: true}}
    board:
      - id: omega
        latex: "\\Omega = \\dfrac{r m g}{I\\omega}"
        say: "capital omega equals r m g over I omega"
        color: green
        tex_colors:
          "r m g": orange     # the torque, same colour as the tau arrow
          "I\\omega": blue     # the angular momentum, same colour as L
      - id: takeaway
        text: "faster spin, slower precession"
        color: yellow

  - id: s7
    kind: end
    narration: ""
    board: []
