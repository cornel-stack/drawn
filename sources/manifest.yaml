# Open textbooks the lessons draw on. `just sources` downloads every book with
# `auto: true` into sources/<id>.pdf (gitignored), verifies its sha256, and
# extracts per-section text into sources/text/<id>/<section>.md with pymupdf.
#
# sha256 is the integrity pin: once set, a download that does not match is
# rejected. Leave it empty for a new book and the first `just sources` run fills
# it in (and prints it) so the pin is recorded on the next commit.
#
# Only the OpenStax volumes are fetched automatically for now. The author-hosted
# PDFs (Hefferon, Trench, Garín-Lester-Sims, McAfee-Lewis, Bonanno, Hanck) are
# listed with `auto: false` — their stable URLs are added when those channels
# start rendering.

books:
  - id: university-physics-vol1
    title: University Physics Volume 1
    publisher: OpenStax
    licence: CC BY 4.0
    auto: true
    url: https://assets.openstax.org/oscms-prodcms/media/documents/university-physics-volume-1_-_WEB.pdf
    sha256: "93652b69c43197d10dc83438b813b5f7515e61e7ea4336da8636ff902cb4aba8"

