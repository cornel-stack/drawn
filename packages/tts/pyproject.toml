[project]
name = "drawn-tts"
version = "0.1.0"
description = "SpeechService (Kokoro + edge-tts) and whisper word alignment for drawn."
requires-python = ">=3.12,<3.13"
# Heavy runtime deps (kokoro, edge-tts, faster-whisper, manim-voiceover) are
# declared in an optional group so the schema test loop stays light; they are
# installed via `just setup` / in CI.
dependencies = [
    "drawn-schema",
    "pyyaml>=6",
]

[project.optional-dependencies]
runtime = [
    "manim-voiceover>=0.3.7",
    "kokoro>=0.9",
    "edge-tts>=6.1",
    "faster-whisper>=1.0",
    "soundfile>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawn_tts"]

[tool.uv.sources]
drawn-schema = { workspace = true }
