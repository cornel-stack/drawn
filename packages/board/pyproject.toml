[project]
name = "drawn-board"
version = "0.1.0"
description = "Manim scene library (handwriting board, hand-follow) for drawn."
requires-python = ">=3.12,<3.13"
dependencies = [
    "drawn-schema",
    "pyyaml>=6",
]

[project.optional-dependencies]
runtime = [
    "manim>=0.18.1",
    "manim-voiceover>=0.3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawn_board"]

[tool.uv.sources]
drawn-schema = { workspace = true }
