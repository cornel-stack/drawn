[project]
name = "drawn-schema"
version = "0.1.0"
description = "Versioned Lesson schema and linter for drawn."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "openpyxl>=3.1",
    # the linter evaluates worked-problem `check:` expressions
    "numpy>=1.26",
    "sympy>=1.12",
]

[project.scripts]
drawn-schema = "drawn_schema.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawn_schema"]
